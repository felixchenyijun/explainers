const Models = (() => {
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};
  function robot({deposit=1,disposed=0,hidden=0,broken=0,empty=0,vase=false,steps=8}={}) {
    const initial={floor:3,bin:0,hidden:0,broken:false},memo=new Map();
    function moves(s){const out=[];
      if(s.floor){out.push(['put',{...s,floor:s.floor-1,bin:s.bin+1},1]);out.push(['hide',{...s,floor:0,hidden:s.hidden+s.floor},0]);if(vase)out.push(['sweep',{...s,floor:0,bin:s.bin+s.floor,broken:true},s.floor]);}
      if(s.bin)out.push(['take',{...s,bin:s.bin-1,floor:s.floor+1},0]);out.push(['wait',{...s},0]);return out;
    }
    const end=s=>disposed*s.bin+hidden*s.hidden+broken*Number(s.broken)+empty*Number(s.floor===0);
    function solve(s,t){if(!t)return {value:end(s),path:[]};const k=[s.floor,s.bin,s.hidden,+s.broken,t].join();if(memo.has(k))return memo.get(k);
      let best={value:-Infinity,path:[]};for(const [act,next,n] of moves(s)){const rest=solve(next,t-1),value=rest.value+deposit*n-(act==='wait'?0:.001);if(value>best.value+1e-8)best={value,path:[{action:act,...next,deposit:n},...rest.path]};}memo.set(k,best);return best;
    }
    const best=solve(initial,steps);let points=0;const frames=[{...initial,action:'ready',points:0,deposit:0}];
    for(const step of best.path){points+=deposit*step.deposit;frames.push({...step,points});}const last=frames.at(-1);points+=end(last);last.points=points;
    return {frames,points,bin:last.bin,hidden:last.hidden,broken:last.broken,deposits:frames.reduce((a,f)=>a+f.deposit,0)};
  }
  function traffic({n=4000,shortcut=true,cost=0,share=null}={}){
    n=Math.max(1,n);const x=shortcut?(share===null?clamp(200*(45-cost)-n,0,n):n*clamp(share,0,1)):0;
    const side=(n-x)/2,load=(n+x)/2,outer=45+load/100,cross=2*load/100+cost;
    const mean=((n-x)*outer+x*cross)/n;
    return {n,x,side,load,outer,cross,mean,baseline:45+n/200,optimum:clamp((100*(45-cost)-n)/n,0,1)};
  }
  function serve(arrivals,service,servers=1){const free=Array(servers).fill(0),jobs=[];
    arrivals.forEach((at,i)=>{const lane=free.indexOf(Math.min(...free)),start=Math.max(at,free[lane]),duration=Array.isArray(service)?service[i]:service,end=start+duration;free[lane]=end;jobs.push({at,start,end,wait:start-at,lane});});return jobs;
  }
  function cafe({rate=12,servers=1,variable=true,seed=17,horizon=240}={}){
    const random=rng(seed),arrivals=[];let time=0;
    while(true){time+=variable?-Math.log(Math.max(1e-9,1-random()))*60/rate:60/rate;if(time>horizon)break;arrivals.push(time);}
    const jobs=serve(arrivals,4,servers),waits=jobs.map(j=>j.wait).sort((a,b)=>a-b),mean=waits.reduce((a,b)=>a+b,0)/Math.max(1,waits.length);
    const line=Array.from({length:horizon+1},(_,t)=>({t,q:jobs.filter(j=>j.at<=t&&j.start>t).length}));
    return {jobs,line,mean,p95:waits[Math.max(0,Math.ceil(waits.length*.95)-1)]||0,util:rate*4/(60*servers),max:Math.max(...line.map(p=>p.q)),customers:jobs.length,horizon};
  }
  const profiles={original:[{n:42,rank:'ABC'},{n:26,rank:'BCA'},{n:32,rank:'CBA'}],majority:[{n:51,rank:'ABC'},{n:49,rank:'BCA'},{n:0,rank:'CAB'}],cycle:[{n:34,rank:'ABC'},{n:33,rank:'BCA'},{n:33,rank:'CAB'}],challenge:[{n:45,rank:'ABC'},{n:35,rank:'BCA'},{n:20,rank:'CBA'}]};
  function voting(profile=profiles.original,rule='plurality'){
    const names=['A','B','C'],total=profile.reduce((a,g)=>a+g.n,0),first={A:0,B:0,C:0},points={A:0,B:0,C:0};
    for(const g of profile){first[g.rank[0]]+=g.n;[...g.rank].forEach((c,i)=>points[c]+=g.n*(2-i));}
    let scores={...first},eliminated=null,eliminationTie=false;

  }
  function fish({player=4,others=4,quota=null,monitor=false,defector=false,rate=.4,shock=false,years=16,start=80}={}){
    let stock=start,income=0,totalCatch=0;const history=[{year:0,stock,catch:0,growth:0,income:0,fee:0}];
    for(let year=1;year<=years;year++){

      const left=Math.max(0,stock-caught),r=shock&&year>=7?rate*.6:rate,growth=left<1?0:r*left*(1-left/120);

      history.push({year,stock,catch:caught,growth,income,fee,own,rate:r});
    }
    return {history,stock,income,totalCatch,extinct:stock<1,maxGrowth:rate*120/4};
  }
  function cascade(signals=[1,1,-1,-1,-1,-1,-1,-1],shareClues=false){let publicEvidence=0;const rows=[];
    for(let i=0;i<signals.length;i++){const signal=signals[i],prior=publicEvidence,posterior=prior+signal,choice=posterior===0?signal:Math.sign(posterior),informative=Math.abs(prior)<2;
      publicEvidence+=shareClues?signal:(informative?choice:0);
      rows.push({i,signal,prior,posterior,choice,informative,publicEvidence,confidence:1/(1+Math.pow(2,-Math.abs(posterior)))});
    }
    return {rows,publicEvidence,allClues:signals.reduce((a,b)=>a+b,0),publicRed:1/(1+Math.pow(2,-publicEvidence))};
  }
  return {clamp,rng,robot,traffic,serve,cafe,profiles,voting,fish,cascade};
})();

const G={slug:'who-won',title:'Who Actually Won?',theme:'A game about the meaning of a majority',chapters:['The village picnic','Count first choices','Try a runoff','Give points','Which kind of fair?','Your turn','Take it with you'],names:{A:'Berries',B:'Buns',C:'Mushrooms'},initialLab:{preset:'original',rule:'plurality',n0:42,n1:26,n2:32,r0:'ABC',r1:'BCA',r2:'CBA'},model:'Every voter submits a complete, sincere ranking of three choices. Plurality counts first choices. Instant runoff repeatedly removes the lowest first-choice tally; with three choices, one elimination suffices unless a majority already exists. Borda gives 2, 1, and 0 points by rank. Final ties remain ties. When elimination itself ties, C is removed before B before A; that arbitrary convention is disclosed in the result. Head-to-head comparisons are computed separately. We do not model strategic ballots or claim that one rule is universally fairest.',sources:[['What I think about when I think about voting — American Mathematical Society','https://mathvoices.ams.org/featurecolumn/2023/11/01/what-i-think-about-when-i-think-about-voting/'],['Voting methods — OpenStax','https://openstax.org/books/contemporary-mathematics/pages/11-1-voting-methods']],
 render(){const d=data(),c=S.chapter;if(!S.sandbox&&c===6)return U.completion('“The winner” needs a rule.','The ballots were never ambiguous. The definition of winning was.','Ask which notion of fairness a rule protects—and which it trades away.');
 let profile=S.sandbox?[0,1,2].map(i=>({n:d['n'+i],rank:d['r'+i]})):Models.profiles[c===4?'majority':c===5?'challenge':'original'];let rule=S.sandbox?d.rule:c===2||c===5?'runoff':c===3||c===4?'borda':'plurality';const r=Models.voting(profile,rule);let title,body,controls='',feedback='',show=!!d.choice||S.sandbox;
 if(S.sandbox){title='Hold your own election.';body='Give three groups different tastes. Keep the ballots fixed while changing the counting rule. Does the winner change?';const orders=['ABC','ACB','BAC','BCA','CAB','CBA'];controls=`<div class="controls">${U.select('preset','Starting electorate',d.preset,[['original','Three rules, three winners'],['majority','A majority vs a compromise'],['cycle','A preference cycle']])}${U.select('rule','Counting rule',d.rule,[['plurality','Plurality: first choices'],['runoff','Instant runoff'],['borda','Borda: 2, 1, 0 points']])}${[0,1,2].map(i=>U.range('n'+i,`Group ${i+1}: voters`,d['n'+i],0,80)+U.select('r'+i,`Group ${i+1}: favorite → least favorite`,d['r'+i],orders.map(s=>[s,[...s].map(c=>G.names[c]).join(' → ')]))).join('')}</div>`;feedback=U.feedback(r.winners.length===1?`${G.names[r.winners[0]]} wins.`:r.winners.length?'A tie.':'No voters, no winner.',`${rule==='borda'?'These totals are points, not people.':'These totals are votes.'} ${r.eliminated?'Eliminated '+G.names[r.eliminated]+'. ':''}${r.eliminationTie?'The elimination tie used our explicit C-before-B-before-A rule. ':''}${r.condorcet?G.names[r.condorcet]+' would beat each alternative head to head.':'There is no candidate who strictly beats both others head to head.'}`);}
 else if(c===0){title='One picnic. Three snacks.';body='A village of 100 people can afford one snack. Here are their honest rankings: favorite at the top. Nobody changes their mind during this story.';controls=!d.choice?U.choices('Who looks like the winner?',[['A','Berries'],['B','Buns'],['C','Mushrooms']]):'';show=false;if(d.choice)feedback=U.feedback(`You picked ${G.names[d.choice]}.`,'Keep that prediction. We will count these exact same preferences three different ways. Each rule sounds reasonable.');}
 else if(c===1){title='The most first choices wins.';body='Plurality is familiar: each voter gives one vote to their favorite. Add up only the first row of each group’s rankings.';controls=!d.choice?U.choices('Who wins plurality?',[['A','Berries'],['B','Buns'],['C','Mushrooms']]):'';if(show)feedback=U.feedback('Berries wins with 42 votes.','Forty-two is the largest first-choice group. It is a plurality, not a majority: 58 voters prefer something else. The rule answers “who has the most first choices?”',d.choice==='A');}
 else if(c===2){title='Make the winner get a majority.';body='Try instant runoff. Nobody has over 50%. Eliminate the snack with the fewest first choices, then transfer those ballots to the next remaining preference.';controls=!d.choice?U.choices('Who wins after the transfer?',[['A','Berries'],['B','Buns'],['C','Mushrooms']]):'';if(show)feedback=U.feedback('Mushrooms wins, 58 to 42.','Buns has the fewest first choices: 26. Those voters rank Mushrooms next, so 26 votes join its original 32. Same people, same tastes, a different winner.',d.choice==='C');}
 else if(c===3){title='Maybe every preference should count.';body='Borda scoring gives each ballot’s first choice <strong>2 points</strong>, second choice <strong>1</strong>, and last choice <strong>0</strong>. Predict the highest total.';controls=!d.choice?U.choices('Who wins with points?',[['A','Berries'],['B','Buns'],['C','Mushrooms']]):'';if(show)feedback=U.feedback('Buns wins with 126 points.','Buns gets 42 × 1 + 26 × 2 + 32 × 1 = 126. It lost both previous elections, yet 58 voters prefer it to Berries and 68 prefer it to Mushrooms. It beats either rival head to head.',d.choice==='B');}
 else if(c===4){title='Is compromise always fairer?';body='Try a new village. A strict majority—51 voters—rank Berries first. The other 49 rank it last. Keep the same 2–1–0 scoring rule.';controls=!d.choice?U.choices('Does the majority’s favorite win Borda?',[['yes','Yes, Berries must win'],['no','No, Buns can still win']]):'';if(show)feedback=U.feedback('Buns: 149 points. Berries: 102.','The compromise wins, even though Berries is the first choice of a majority. If “a majority’s first choice must win” is your fairness rule, Borda fails this case. That is a tradeoff, not a counting mistake.',d.choice==='no');}
 else {title='Your turn to count a new village.';body='There are 45 Berries-first, 35 Buns-first, and 20 Mushrooms-first voters. Use <strong>instant runoff</strong>. Read the rankings below before predicting.';controls=!d.choice?U.choices('Which snack wins?',[['A','Berries'],['B','Buns'],['C','Mushrooms']]):'';if(show)feedback=U.feedback(d.choice==='B'?'You followed the transferred votes.':'Watch where the eliminated votes go.','Mushrooms is eliminated with 20 first choices. Those voters prefer Buns next, so Buns finishes with 55 votes against Berries’ 45. A first-round lead need not survive a runoff.',d.choice==='B');}
 return U.scene({title,body,art:show?Art.election(r):'',metrics:show?U.metrics([[r.total,'voters'],[rule==='borda'?'points':'votes','counting unit'],[r.winners.length===1?G.names[r.winners[0]]:'tie','winner']]):'',controls:Art.ballot(profile)+controls,feedback,after:!S.sandbox?U.note('A / B / C identify the same snacks throughout. Rankings are always favorite → least favorite.'):'',ready:!S.sandbox&&!!d.choice,next:c===5?'Finish the story →':'Count another way →'});
 },act(a,v){if(a==='choose')data().choice=v;},change(k,v){const d=data();if(k==='preset'){d.preset=v;Models.profiles[v].forEach((g,i)=>{d['n'+i]=g.n;d['r'+i]=g.rank;});}else d[k]=k[0]==='n'?Number(v):v;}
};

let S,timer=null;
const KEY='small-worlds-v1-'+G.slug;
function fresh(){return {version:1,chapter:0,unlocked:0,chapters:{},lab:structuredClone(G.initialLab),sandbox:false,completed:false,calm:matchMedia('(prefers-reduced-motion: reduce)').matches};}
try{const raw=JSON.parse(localStorage.getItem(KEY));S=raw&&raw.version===1?{...fresh(),...raw,lab:{...G.initialLab,...raw.lab}}:fresh();if(!Number.isInteger(S.chapter)||S.chapter<0||S.chapter>=G.chapters.length||typeof S.chapters!=='object')S=fresh();}catch{S=fresh();}
function data(){return S.sandbox?S.lab:(S.chapters[S.chapter]||=( {} ));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch{}}
function stop(){if(timer)clearInterval(timer);timer=null;}
function isRunning(){return timer!==null;}
function animate(end,ms){stop();const target=data();if(S.calm){target.tick=end;render();return;}timer=setInterval(()=>{target.tick=Math.min(end,(target.tick||0)+1);if(target.tick===end)stop();render();},ms);}
function render(moveFocus=false){
 const focus=document.activeElement?.id,selection=document.activeElement?.tagName==='SELECT';
 const scene=G.render();document.body.classList.toggle('calm',S.calm);
 document.getElementById('app').innerHTML=scene.html+(scene.ready?`<div class="nextrow"><span class="hint">${S.chapter===G.chapters.length-2?'A new setting, the same idea.':'Your next decision builds on this one.'}</span>${U.button(scene.next||'Keep going →','next')}</div>`:'')+`<nav class="progress" aria-label="Story chapters">${G.chapters.map((name,i)=>`<button class="${i===S.chapter&&!S.sandbox?'current ':''}${i<=S.unlocked?'visited':''}" data-do="goto" data-value="${i}" ${i>S.unlocked?'disabled':''} aria-label="Chapter ${i+1}: ${name}" ${i===S.chapter&&!S.sandbox?'aria-current="step"':''}></button>`).join('')}</nav><p class="chapter-meta">${S.sandbox?'SANDBOX · your rules':`${String(S.chapter+1).padStart(2,'0')} / ${String(G.chapters.length).padStart(2,'0')} · ${G.chapters[S.chapter]}`}</p><details class="sources"><summary>Inside this little world: assumptions & sources</summary><p>${G.model}</p><ul>${G.sources.map(([name,url])=>`<li><a href="${url}" target="_blank" rel="noopener">${name} ↗</a></li>`).join('')}</ul><p>Original art and simulation. Inspired by the learning-through-play structure of <a href="https://ncase.me/trust/" target="_blank" rel="noopener">The Evolution of Trust</a> by Nicky Case. No accounts or tracking. Progress is stored only in this browser.</p></details>`;
 document.getElementById('mode').textContent=S.sandbox?'Return to story':'Sandbox';
 document.getElementById('motion').textContent=S.calm?'Motion off':'Motion on';
 document.getElementById('motion').setAttribute('aria-pressed',String(!S.calm));
 document.getElementById('back').hidden=S.sandbox||S.chapter===0;
 if(moveFocus){document.getElementById('scene-title').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}else if(focus){document.getElementById(focus)?.focus({preventScroll:true});}
 save();
}
function go(c){stop();S.sandbox=false;S.chapter=c;S.unlocked=Math.max(S.unlocked,c);if(c===G.chapters.length-1)S.completed=true;render(true);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-do]');if(!b||b.disabled)return;const a=b.dataset.do,v=b.dataset.value;
 if(a==='next'){if(G.render().ready)go(Math.min(G.chapters.length-1,S.chapter+1));return;}
 if(a==='back'){go(Math.max(0,S.chapter-1));return;}
 if(a==='goto'){const n=Number(v);if(n<=S.unlocked)go(n);return;}
 if(a==='lab'){stop();S.sandbox=!S.sandbox;render(true);return;}
 if(a==='motion'){S.calm=!S.calm;if(S.calm&&timer)stop();render();return;}
 if(a==='pause'){stop();render();return;}
 if(a==='restart'){document.getElementById('reset-confirm').hidden=false;return;}
 if(a==='cancel-reset'){document.getElementById('reset-confirm').hidden=true;return;}
 if(a==='confirm-reset'){stop();S=fresh();document.getElementById('reset-confirm').hidden=true;render(true);return;}
 G.act(a,v);render();
});
