</style></head><body><a class="skip" href="#app">Skip to the game</a><header class="mast"><a class="brand" href="../small-worlds/">small <span>worlds</span></a><div class="mast-right"><span class="volume">EVIDENCE & SOCIAL LEARNING</span><button class="textbtn sound-toggle" data-do="sound" id="sound" aria-pressed="false">♩ Sound off</button><button class="textbtn" data-do="motion" id="motion" aria-pressed="true">Motion on</button><button class="textbtn" data-do="lab" id="mode">Sandbox</button></div></header><main id="app"></main><noscript><p>This game needs JavaScript to run its simulations. All code is included in this page; no sign-in or network connection is required after loading.</p></noscript><footer class="foot"><button class="textbtn" data-do="back" id="back">← Previous chapter</button><a href="../small-worlds/">All six worlds</a><div class="restart-actions"><button class="textbtn" data-do="restart-chapter" id="restart-chapter">Restart chapter</button><button class="textbtn" data-do="restart">Restart story</button></div></footer><div id="reset-confirm" hidden style="text-align:center;padding:20px"><p>Restart this story and clear its saved progress on this device?</p><button class="btn secondary" data-do="cancel-reset">Keep playing</button> <button class="btn" data-do="confirm-reset">Restart story</button></div><script>/* Original, deterministic teaching models. No external dependencies. */
const Models = (() => {
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};
  function robot({deposit=1,disposed=0,hidden=0,broken=0,empty=0,vase=false,steps=8}={}) {
    const initial={floor:3,bin:0,hidden:0,broken:false},memo=new Map();
    function moves(s){const out=[];
      if(s.floor){out.push(['put',{...s,floor:s.floor-1,bin:s.bin+1},1]);out.push(['hide',{...s,floor:0,hidden:s.hidden+s.floor},0]);if(vase)out.push(['sweep',{...s,floor:0,bin:s.bin+s.floor,broken:true},s.floor]);}
      if(s.bin)out.push(['take',{...s,bin:s.bin-1,floor:s.floor+1},0]);out.push(['wait',{...s},0]);return out;
    }
    const end=s=>disposed*s.bin+hidden*s.hidden+broken*Number(s.broken)+empty*Number(s.floor===0);
    function solve(s,t){if(!t)return {value:end(s),path:[]};const k=[s.floor,s.bin,s.hidden,+s.broken,t].join();if(memo.has(k))return memo.get(k);
      let best={value:-Infinity,path:[]};for(const [act,next,n] of moves(s)){const rest=solve(next,t-1),value=rest.value+deposit*n-(act==='wait'?0:.001);if(value>best.value+1e-8)best={value,path:[{action:act,...next,deposit:n},...rest.path]};}memo.set(k,best);return best;
    }
    const best=solve(initial,steps);let points=0;const frames=[{...initial,action:'ready',points:0,deposit:0}];
    for(const step of best.path){points+=deposit*step.deposit;frames.push({...step,points});}const last=frames.at(-1);points+=end(last);last.points=points;
    return {frames,points,bin:last.bin,hidden:last.hidden,broken:last.broken,deposits:frames.reduce((a,f)=>a+f.deposit,0)};
  }
  function traffic({n=4000,shortcut=true,cost=0,share=null}={}){
    n=Math.max(1,n);const x=shortcut?(share===null?clamp(200*(45-cost)-n,0,n):n*clamp(share,0,1)):0;
    const side=(n-x)/2,load=(n+x)/2,outer=45+load/100,cross=2*load/100+cost;
    const mean=((n-x)*outer+x*cross)/n;
    return {n,x,side,load,outer,cross,mean,baseline:45+n/200,optimum:clamp((100*(45-cost)-n)/n,0,1)};
  }
  function serve(arrivals,service,servers=1){const free=Array(servers).fill(0),jobs=[];
    arrivals.forEach((at,i)=>{const lane=free.indexOf(Math.min(...free)),start=Math.max(at,free[lane]),duration=Array.isArray(service)?service[i]:service,end=start+duration;free[lane]=end;jobs.push({at,start,end,wait:start-at,lane});});return jobs;
  }
  function cafe({rate=12,servers=1,variable=true,seed=17,horizon=240}={}){
    const random=rng(seed),arrivals=[];let time=0;
    while(true){time+=variable?-Math.log(Math.max(1e-9,1-random()))*60/rate:60/rate;if(time>horizon)break;arrivals.push(time);}
    const jobs=serve(arrivals,4,servers),waits=jobs.map(j=>j.wait).sort((a,b)=>a-b),mean=waits.reduce((a,b)=>a+b,0)/Math.max(1,waits.length);
    const line=Array.from({length:horizon+1},(_,t)=>({t,q:jobs.filter(j=>j.at<=t&&j.start>t).length}));
    return {jobs,line,mean,p95:waits[Math.max(0,Math.ceil(waits.length*.95)-1)]||0,util:rate*4/(60*servers),max:Math.max(...line.map(p=>p.q)),customers:jobs.length,horizon};
  }
  const profiles={original:[{n:42,rank:'ABC'},{n:26,rank:'BCA'},{n:32,rank:'CBA'}],majority:[{n:51,rank:'ABC'},{n:49,rank:'BCA'},{n:0,rank:'CAB'}],cycle:[{n:34,rank:'ABC'},{n:33,rank:'BCA'},{n:33,rank:'CAB'}],challenge:[{n:45,rank:'ABC'},{n:35,rank:'BCA'},{n:20,rank:'CBA'}]};
  function voting(profile=profiles.original,rule='plurality'){
    const names=['A','B','C'],total=profile.reduce((a,g)=>a+g.n,0),first={A:0,B:0,C:0},points={A:0,B:0,C:0};
    for(const g of profile){first[g.rank[0]]+=g.n;[...g.rank].forEach((c,i)=>points[c]+=g.n*(2-i));}
    let scores={...first},eliminated=null,eliminationTie=false;
    if(rule==='borda')scores=points;
    if(rule==='runoff'&&Math.max(...Object.values(first))<=total/2){const min=Math.min(...Object.values(first)),tied=names.filter(c=>first[c]===min);eliminationTie=tied.length>1;eliminated=tied.at(-1);scores={A:0,B:0,C:0};for(const g of profile)scores[[...g.rank].find(c=>c!==eliminated)]+=g.n;}
    const eligible=names.filter(c=>c!==eliminated),best=Math.max(...eligible.map(c=>scores[c])),winners=total?eligible.filter(c=>scores[c]===best):[];
    const pairwise={};for(const a of names)for(const b of names)if(a!==b)pairwise[a+b]=profile.reduce((sum,g)=>sum+(g.rank.indexOf(a)<g.rank.indexOf(b)?g.n:0),0);
    const condorcet=names.find(a=>names.filter(b=>a!==b).every(b=>pairwise[a+b]>pairwise[b+a]))||null;
    return {scores,first,points,winners,eliminated,eliminationTie,total,pairwise,condorcet};
  }
  function fish({player=4,others=4,quota=null,monitor=false,defector=false,rate=.4,shock=false,years=16,start=80}={}){
    let stock=start,income=0,totalCatch=0;const history=[{year:0,stock,catch:0,growth:0,income:0,fee:0}];
    for(let year=1;year<=years;year++){
      const desired=[player,others,others,others].map((c,i)=>quota===null?c:(defector&&i===3&&!monitor?6:Math.min(c,quota)));
      const demand=desired.reduce((a,b)=>a+b,0),scale=demand?Math.min(1,stock/demand):0,caught=demand*scale,own=desired[0]*scale;
      const left=Math.max(0,stock-caught),r=shock&&year>=7?rate*.6:rate,growth=left<1?0:r*left*(1-left/120);
      stock=left<1?0:clamp(left+growth,0,120);const fee=monitor?.4:0;income+=own-fee;totalCatch+=caught;
      history.push({year,stock,catch:caught,growth,income,fee,own,rate:r});
    }
    return {history,stock,income,totalCatch,extinct:stock<1,maxGrowth:rate*120/4};
  }
  function cascade(signals=[1,1,-1,-1,-1,-1,-1,-1],shareClues=false){let publicEvidence=0;const rows=[];
    for(let i=0;i<signals.length;i++){const signal=signals[i],prior=publicEvidence,posterior=prior+signal,choice=posterior===0?signal:Math.sign(posterior),informative=Math.abs(prior)<2;
      publicEvidence+=shareClues?signal:(informative?choice:0);
      rows.push({i,signal,prior,posterior,choice,informative,publicEvidence,confidence:1/(1+Math.pow(2,-Math.abs(posterior)))});
    }
    return {rows,publicEvidence,allClues:signals.reduce((a,b)=>a+b,0),publicRed:1/(1+Math.pow(2,-publicEvidence))};
  }
  return {clamp,rng,robot,traffic,serve,cafe,profiles,voting,fish,cascade};
})();

const RumorMath={
 pair(k){return k>=0?[2**k,1]:[1,2**(-k)];},

  let title='What did the crowd actually learn?',intro='Odds always read red : blue. Only a new observation can change them.',summary;
  if(early){
   title=chapter===0?'Why does one blue clue mean 2 in 3?':'Why can red beat your own blue clue?';
   summary=chapter===0?'<span>1 : 1</span><i>× ½ =</i><strong>1 : 2</strong>':'<span>1 : 1</span><i>× 2 × 2 × ½ =</i><strong>2 : 1</strong>';
  }else summary=`<span>Public odds after ${count} ${share?'shared clues':'choices'}</span><strong>${this.odds(ev)}</strong>`;
  let out=`<section class="rumor-math" aria-labelledby="math-title"><p class="math-kicker">FOLLOW THE EVIDENCE</p><h2 id="math-title">${title}</h2><p>${intro}</p><div class="odds-equation">${summary}</div>`;
  if(early){out+=this.bar(chapter===0?-1:1,'Your belief, including your blue clue');if(chapter===1)out+='<p class="math-aside">An observer who has seen only the two red choices has 4 : 1 odds (80% red). Your extra blue clue changes <em>your</em> odds to 2 : 1 (66.7% red).</p>';}

 },
 basics(chapter){return `<div class="math-basics"><h3>Start with the likelihood of the clue.</h3><p>A blue clue occurs with probability ⅓ if the jar is red, and ⅔ if it is blue. So it is twice as likely under the blue jar. Bayes’ rule multiplies the prior red-to-blue odds by <strong>(⅓)/(⅔) = ½</strong>.</p><p>To turn odds a : b into a probability, divide by the total: <strong>P(red) = a/(a + b)</strong>. Thus 1 : 2 gives P(blue) = 2/(1 + 2) = ⅔.</p>${chapter===1?'<h3>Why do the first two red choices count?</h3><p>The first person follows their clue. The second, after a red choice, would have odds 4 : 1 with a red clue, or 1 : 1 with a blue clue. At a tie, people in this game follow their own clue. So the second person chooses red <em>only</em> with a red clue.</p><p>Those two choices therefore reveal two independent red clues: 1 × 2 × 2 = 4. Your blue clue halves that to 2. P(red | two red choices, your blue clue) = <strong>2/(2 + 1) = ⅔</strong>.</p>':''}</div>`;},
 ledger(r,count,share,reveal,d){
  if(!count)return '<p class="math-aside">Use “One person” above to make the first decision. The ledger will grow with the crowd.</p>';
  const index=Math.min(count-1,Math.max(0,Number.isInteger(d.mathPerson)?d.mathPerson:count-1)),row=r.rows[index],delta=row.publicEvidence-row.prior;
  const branches=[1,-1].map(signal=>{const k=row.prior+signal,choice=k===0?signal:Math.sign(k);return {signal,k,choice};}),same=branches[0].choice===branches[1].choice;
  let out=`<h3>Inspect a person’s decision.</h3><p class="math-aside">Pick a numbered choice. The calculation uses the information available <em>at that moment</em>.</p><div class="evidence-ledger" aria-label="Inspect a public decision">${r.rows.slice(0,count).map((x,i)=>`<button class="ledger-person ${i===index?'selected':''}" id="math-person-${i}" data-do="math-person" data-value="${i}" aria-pressed="${i===index}" aria-label="Inspect person ${i+1}, chose ${this.color(x.choice)}, public odds ${this.odds(x.publicEvidence)}"><span>PERSON ${i+1}</span><b class="${x.choice===1?'red-ink':'blue-ink'}">${this.color(x.choice)}</b><small>× ${this.factor(x.publicEvidence-x.prior)}</small></button>`).join('')}</div>`;
  out+=`<div class="person-proof" data-math-person="${index}"><h3>Person ${index+1} starts with ${this.odds(row.prior)} odds.</h3><p>What would they choose with <em>either</em> possible clue?</p><table class="branch-table"><caption>Private belief after combining the earlier public evidence with one new clue</caption><thead><tr><th scope="col">Their clue</th><th scope="col">Red : blue odds</th><th scope="col">P(red)</th><th scope="col">Choice</th></tr></thead><tbody>${branches.map(x=>`<tr><th scope="row" class="${x.signal===1?'red-ink':'blue-ink'}">${this.color(x.signal)}</th><td>${this.odds(row.prior)} × ${this.factor(x.signal)}<br><strong>= ${this.odds(x.k)}</strong></td><td>${this.fraction(x.k)}<br>${this.percent(x.k)}</td><td class="${x.choice===1?'red-ink':'blue-ink'}"><strong>${this.color(x.choice)}</strong>${x.k===0?'<small>Tie → own clue</small>':''}</td></tr>`).join('')}</tbody></table>`;
  if(share)out+=`<p class="math-insight">The clue itself is shared: <strong>${this.color(row.signal)}</strong>. It contributes a factor of <strong>${this.factor(row.signal)}</strong>, even ${same?'though both clues produce the same choice':'when the choice already reveals the clue'}. Counting the clue and its choice separately would count the same information twice.</p>`;
  else if(same)out+=`<p class="math-insight">Both clues lead to <strong>${this.color(row.choice)}</strong>. Given this history, that choice is certain under <em>either jar</em>: its likelihood ratio is <strong>1/1 = 1</strong>. The observer learns nothing new about the jar.</p>`;
  else out+=`<p class="math-insight">Different clues lead to different choices. Seeing <strong>${this.color(row.choice)}</strong> therefore reveals a <strong>${this.color(row.choice).toLowerCase()} clue</strong>, giving a likelihood ratio of <strong>${row.choice===1?'(⅔)/(⅓) = 2':'(⅓)/(⅔) = ½'}</strong>.</p>`;
  out+=`<div class="public-update"><span>Observer’s update</span><strong>${this.odds(row.prior)} × ${this.factor(delta)} = ${this.odds(row.publicEvidence)}</strong><span>P(red) = ${this.fraction(row.publicEvidence)} = ${this.percent(row.publicEvidence)}</span></div>`;
  if(reveal)out+=`<p class="math-aside">Actual private clue: <strong>${this.color(row.signal)}</strong>. This person’s own P(red) was ${this.fraction(row.posterior)} = ${this.percent(row.posterior)}. ${share?'Their clue is now available to the next person.':'Only their choice was available to the next person.'}</p>`;
  out+='</div>';
  if(!share&&Math.abs(r.rows[count-1].publicEvidence)>=2)out+='<p class="math-aside">A hundred further choices would leave these public odds unchanged if everyone still follows the same rule and no new clues become public. Identical decisions need not mean identical private beliefs.</p>';

 },
 proof(r,reveal,includeCascade){
  const reds=r.rows.filter(x=>x.signal===1).length,blues=r.rows.length-reds,n=r.rows.length,wr=2**reds,wb=2**blues;
  return `<h3>The assumptions that make the arithmetic work</h3><p>R and B mean the red and blue jars. Each has prior probability ½. A clue matches the jar with probability ⅔. <strong>Clues are independent conditional on the jar</strong>—imagine drawing a ball, replacing it, then drawing again. Everyone knows this setup, sees the available history, and chooses the jar with higher posterior probability. At exactly ½, they follow their own clue.</p><h3>Bayes’ rule, in odds form</h3><p>Let H be the observations so far, and x the next observation. Then:</p><div class="formal-equation"><span>P(R | H, x) / P(B | H, x)</span><b>=</b><span>[P(R | H) / P(B | H)]</span><b>×</b><span>[P(x | R, H) / P(x | B, H)]</span></div><p>The first bracket is the old odds. The second is the <strong>likelihood ratio</strong>: how much more likely this observation is under R than B. The common normalization P(x | H) cancels when the two versions of Bayes’ rule are divided.</p><table class="branch-table likelihood-table"><caption>Likelihoods of a fresh private clue</caption><thead><tr><th scope="col">Observation</th><th scope="col">If jar is R</th><th scope="col">If jar is B</th><th scope="col">Multiplier</th></tr></thead><tbody><tr><th scope="row">Red clue</th><td>⅔</td><td>⅓</td><td>2</td></tr><tr><th scope="row">Blue clue</th><td>⅓</td><td>⅔</td><td>½</td></tr></tbody></table><p>Independent clues let us multiply these ratios. <strong>Choices are dependent on earlier choices</strong>, so we must calculate P(choice | jar, history). We cannot treat every red choice as a fresh red clue.</p>${includeCascade?`<h3>Why the cascade starts at 4 : 1</h3><p>Write the public red-to-blue odds as 2<sup>k</sup>. A red clue adds 1 to k; a blue clue subtracts 1. If k is −1, 0, or 1, the choice reveals the clue under our tie rule. If k ≥ 2, even a blue clue leaves k − 1 ≥ 1, so both clues lead to red. If k ≤ −2, both lead to blue.</p><p>Once both clues give the same choice, its conditional likelihood is 1 under either jar. Multiplying by 1 leaves k unchanged. This proves, by induction, why later choices keep repeating without increasing public confidence.</p><h3>Check the story’s eight-red-choice history directly</h3><p>With only choices visible, eight red choices occur exactly when the first two clues are red. The other six clues can be anything: their probabilities sum to 1.</p><div class="formal-equation">P(8 red choices | R) = (⅔)² = 4/9<br>P(8 red choices | B) = (⅓)² = 1/9<br>P(R | 8 red choices) = (4/9) / (4/9 + 1/9) = <strong>4/5 = 80%</strong></div><p>The tempting 2<sup>8</sup> = 256 : 1 calculation would be valid for eight independent red <em>clues</em>. It is invalid for eight red choices in this story.</p>`:''}${reveal?`<h3>Check the actual envelopes directly</h3><p>This order contains ${reds} red clues and ${blues} blue clues. Its likelihood under R is (⅔)<sup>${reds}</sup>(⅓)<sup>${blues}</sup> = ${wr}/${3**n}. Under B, it is (⅓)<sup>${reds}</sup>(⅔)<sup>${blues}</sup> = ${wb}/${3**n}.</p><div class="formal-equation">P(R | all clues) = ${wr}/(${wr} + ${wb}) = <strong>${this.fraction(r.allClues)} = ${this.percent(r.allClues)}</strong></div><p>The equal priors and common denominator cancel. If we observed only the counts rather than this exact order, the same binomial coefficient would occur in both likelihoods and cancel too. Reordering the clues therefore changes no one’s posterior <em>once all clues are visible</em>.</p>`:''}<p class="math-aside">These are exact results for this model, not a claim that every real crowd behaves this way. Unequal priors, different clue strengths, shared sources, mistakes, or a different tie rule can change the result. A cascade can also be correct; confidence is not certainty.</p><p class="math-citation">Further reading: <a href="https://www.aeaweb.org/articles?id=10.1257/jep.10.4.187" target="_blank" rel="noopener">Anderson & Holt’s classroom experiment</a> and <a href="https://www.aeaweb.org/articles?id=10.1257/jel.20241472" target="_blank" rel="noopener">Bikhchandani et al.’s review of social learning</a>. The calculations above are derived for this game’s stated assumptions.</p>`;
 }
};

 const motion=Motion.before(),focus=document.activeElement?.id;
 const scene=G.render();document.body.classList.toggle('calm',S.calm);
 document.getElementById('app').innerHTML=scene.html+(scene.ready?`<div class="nextrow"><span class="hint">${S.chapter===G.chapters.length-2?'A new setting, the same idea.':'Your next decision builds on this one.'}</span>${U.button(scene.next||'Keep going →','next')}</div>`:'')+`<nav class="progress" aria-label="Story chapters">${G.chapters.map((name,i)=>`<button class="${i===S.chapter&&!S.sandbox?'current ':''}${i<=S.unlocked?'visited':''}" data-do="goto" data-value="${i}" ${i>S.unlocked?'disabled':''} aria-label="Chapter ${i+1}: ${name}" ${i===S.chapter&&!S.sandbox?'aria-current="step"':''}></button>`).join('')}</nav><p class="chapter-meta">${S.sandbox?'SANDBOX · your rules':`${String(S.chapter+1).padStart(2,'0')} / ${String(G.chapters.length).padStart(2,'0')} · ${G.chapters[S.chapter]}`}</p><details class="sources"><summary>Inside this little world: assumptions & sources</summary><p>${G.model}</p><ul>${G.sources.map(([name,url])=>`<li><a href="${url}" target="_blank" rel="noopener">${name} ↗</a></li>`).join('')}</ul><p>Original art and simulation. Inspired by the learning-through-play structure of <a href="https://ncase.me/trust/" target="_blank" rel="noopener">The Evolution of Trust</a> by Nicky Case. No accounts or tracking. Progress is stored only in this browser.</p></details>`;
 document.getElementById('mode').textContent=S.sandbox?'Return to story':'Sandbox';
 document.getElementById('motion').textContent=S.calm?'Motion off':'Motion on';
 document.getElementById('motion').setAttribute('aria-pressed',String(!S.calm));
 document.getElementById('back').hidden=S.sandbox||S.chapter===0;
 document.getElementById('restart-chapter').textContent=S.sandbox?'Reset sandbox':'Restart chapter';
 document.getElementById('restart-chapter').hidden=!S.sandbox&&S.chapter===G.chapters.length-1;
 if(moveFocus){document.getElementById('scene-title').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}else if(focus){document.getElementById(focus)?.focus({preventScroll:true});}
 Sound.update();Motion.after(motion);save();
}
function go(c){stop();Sound.play(c===G.chapters.length-1?'complete':'page');S.sandbox=false;S.chapter=c;S.unlocked=Math.max(S.unlocked,c);if(c===G.chapters.length-1)S.completed=true;render(true);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-do]');if(!b||b.disabled)return;const a=b.dataset.do,v=b.dataset.value;
 if(a==='sound'){Sound.set(!Sound.enabled);if(Sound.enabled)Sound.play('on');return;}
 Sound.init();
 if(a==='next'){if(G.render().ready)go(Math.min(G.chapters.length-1,S.chapter+1));return;}
 if(a==='back'){go(Math.max(0,S.chapter-1));return;}
 if(a==='goto'){const n=Number(v);if(n<=S.unlocked)go(n);return;}
 if(a==='lab'){stop();S.sandbox=!S.sandbox;render(true);return;}
 if(a==='motion'){S.calm=!S.calm;if(S.calm&&timer)stop();render();return;}
 if(a==='pause'){stop();Sound.silence();render();return;}
 if(a==='restart-chapter'){stop();Sound.silence();if(S.sandbox)S.lab=structuredClone(G.initialLab);else delete S.chapters[S.chapter];Sound.play('page');render(true);return;}
 if(a==='restart'){document.getElementById('reset-confirm').hidden=false;return;}
 if(a==='cancel-reset'){document.getElementById('reset-confirm').hidden=true;return;}
 if(a==='confirm-reset'){stop();S=fresh();document.getElementById('reset-confirm').hidden=true;render(true);return;}
 G.act(a,v);Sound.action(a);render();if(a==='play'&&G.slug==='little-cafe')document.querySelector('.cafe-dashboard')?.scrollIntoView({block:'start',behavior:'instant'});
});
document.addEventListener('input',e=>{if(e.target.matches('input[type=range][data-key]'))document.getElementById('out-'+e.target.dataset.key).textContent=e.target.value+(e.target.dataset.unit||'');});
document.addEventListener('change',e=>{if(!e.target.dataset.key)return;stop();G.change(e.target.dataset.key,e.target.value);Sound.play('tap');render();});
window.addEventListener('pagehide',()=>{stop();Sound.silence();save();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();Sound.silence();render();}});
window.addEventListener('storage',e=>{if(e.key==='small-worlds-sound'){Sound.enabled=Sound.read();if(!Sound.enabled)Sound.silence();Sound.update();}});
window.SmallWorlds={getState:()=>structuredClone(S),model:Models,game:G.slug};
render();
</script></body></html>
