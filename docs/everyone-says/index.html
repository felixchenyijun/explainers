/* A mathematical reading of the same decisions shown in the story. */
const RumorMath={
 pair(k){return k>=0?[2**k,1]:[1,2**(-k)];},
 odds(k){return this.pair(k).join(' : ');},
 fraction(k){const [a,b]=this.pair(k);return `${a}/${a+b}`;},
 percent(k){const [a,b]=this.pair(k);return U.fmt(100*a/(a+b),1)+'%';},
 color(s){return s===1?'Red':'Blue';},
 factor(k){return k===0?'1':k>0?String(2**k):`1/${2**(-k)}`;},
 bar(k,label){const [a,b]=this.pair(k),p=100*a/(a+b);return `<div class="belief"><div class="belief-label"><span>${label}</span><strong>${this.fraction(k)} = ${this.percent(k)} red</strong></div><div class="belief-bar" aria-hidden="true"><span style="width:${p}%"></span></div><div class="belief-key"><span>RED ${this.percent(k)}</span><span>BLUE ${this.percent(-k)}</span></div></div>`;},
 toggle(action,label,open,target){return `<button class="btn secondary small math-toggle" id="btn-${action}" data-do="${action}" aria-expanded="${!!open}" aria-controls="${target}">${label} <span aria-hidden="true">${open?'−':'+'}</span></button>`;},
 panel({chapter,d,r,count,share,reveal,lab,opened=false}){
  if(!lab&&chapter<2&&!d.choice)return '';
  const early=!lab&&chapter<2,ev=opened?r.allClues:count?r.rows[count-1].publicEvidence:0;
  let title='What did the crowd actually learn?',intro='Odds always read red : blue. Only a new observation can change them.',summary;
  if(early){
   title=chapter===0?'Why does one blue clue mean 2 in 3?':'Why can red beat your own blue clue?';
   summary=chapter===0?'<span>1 : 1</span><i>× ½ =</i><strong>1 : 2</strong>':'<span>1 : 1</span><i>× 2 × 2 × ½ =</i><strong>2 : 1</strong>';
  }else summary=`<span>Public odds after ${count} ${opened?'opened clues':share?'shared clues':'choices'}</span><strong>${this.odds(ev)}</strong>`;
  let out=`<section class="rumor-math" aria-labelledby="math-title"><p class="math-kicker">FOLLOW THE EVIDENCE</p><h2 id="math-title">${title}</h2><p>${intro}</p><div class="odds-equation">${summary}</div>`;
  if(early){out+=this.bar(chapter===0?-1:1,'Your belief, including your blue clue');if(chapter===1)out+='<p class="math-aside">An observer who has seen only the two red choices has 4 : 1 odds (80% red). Your extra blue clue changes <em>your</em> odds to 2 : 1 (66.7% red).</p>';}
  else{out+=this.bar(ev,opened?'Observer after opening all envelopes':share?'Observer given the shared clues':'Observer given only the choices');if(opened)out+=this.bar(r.publicEvidence,'Before opening: observer given only the choices');else if(reveal)out+=this.bar(r.allClues,'Someone given all eight private clues');}
  out+=this.toggle('math',d.mathOpen?'Close the working':'Show the math',d.mathOpen,'math-working');
  out+=`<div id="math-working" ${d.mathOpen?'':'hidden'}>`;
  if(early)out+=this.basics(chapter);
  else{if(opened)out+='<p class="math-aside">The ledger below reconstructs the original choices, before any envelopes were opened. The new overall belief above includes all the clues you have now seen.</p>';out+=this.ledger(r,count,share,reveal,d);}
  out+=this.toggle('math-proof',d.proofOpen?'Close the full derivation':'Bayes’ rule & the full derivation',d.proofOpen,'math-proof');
  out+=`<div class="math-proof" id="math-proof" ${d.proofOpen?'':'hidden'}>${this.proof(r,reveal,!early)}</div></div></section>`;
  return out;
 },
 basics(chapter){return `<div class="math-basics"><h3>Start with the likelihood of the clue.</h3><p>A blue clue occurs with probability ⅓ if the jar is red, and ⅔ if it is blue. So it is twice as likely under the blue jar. Bayes’ rule multiplies the prior red-to-blue odds by <strong>(⅓)/(⅔) = ½</strong>.</p><p>To turn odds a : b into a probability, divide by the total: <strong>P(red) = a/(a + b)</strong>. Thus 1 : 2 gives P(blue) = 2/(1 + 2) = ⅔.</p>${chapter===1?'<h3>Why do the first two red choices count?</h3><p>The first person follows their clue. The second, after a red choice, would have odds 4 : 1 with a red clue, or 1 : 1 with a blue clue. At a tie, people in this game follow their own clue. So the second person chooses red <em>only</em> with a red clue.</p><p>Those two choices therefore reveal two independent red clues: 1 × 2 × 2 = 4. Your blue clue halves that to 2. P(red | two red choices, your blue clue) = <strong>2/(2 + 1) = ⅔</strong>.</p>':''}</div>`;},
 ledger(r,count,share,reveal,d){
  if(!count)return '<p class="math-aside">Use “One person” above to make the first decision. The ledger will grow with the crowd.</p>';
  const index=Math.min(count-1,Math.max(0,Number.isInteger(d.mathPerson)?d.mathPerson:count-1)),row=r.rows[index],delta=row.publicEvidence-row.prior;
  const branches=[1,-1].map(signal=>{const k=row.prior+signal,choice=k===0?signal:Math.sign(k);return {signal,k,choice};}),same=branches[0].choice===branches[1].choice;
  let out=`<h3>Inspect a person’s decision.</h3><p class="math-aside">Pick a numbered choice. The calculation uses the information available <em>at that moment</em>.</p><div class="evidence-ledger" aria-label="Inspect a public decision">${r.rows.slice(0,count).map((x,i)=>`<button class="ledger-person ${i===index?'selected':''}" id="math-person-${i}" data-do="math-person" data-value="${i}" aria-pressed="${i===index}" aria-label="Inspect person ${i+1}, chose ${this.color(x.choice)}, public odds ${this.odds(x.publicEvidence)}"><span>PERSON ${i+1}</span><b class="${x.choice===1?'red-ink':'blue-ink'}">${this.color(x.choice)}</b><small>× ${this.factor(x.publicEvidence-x.prior)}</small></button>`).join('')}</div>`;
  out+=`<div class="person-proof" data-math-person="${index}"><h3>Person ${index+1} starts with ${this.odds(row.prior)} odds.</h3><p>What would they choose with <em>either</em> possible clue?</p><table class="branch-table"><caption>Private belief after combining the earlier public evidence with one new clue</caption><thead><tr><th scope="col">Their clue</th><th scope="col">Red : blue odds</th><th scope="col">P(red)</th><th scope="col">Choice</th></tr></thead><tbody>${branches.map(x=>`<tr><th scope="row" class="${x.signal===1?'red-ink':'blue-ink'}">${this.color(x.signal)}</th><td>${this.odds(row.prior)} × ${this.factor(x.signal)}<br><strong>= ${this.odds(x.k)}</strong></td><td>${this.fraction(x.k)}<br>${this.percent(x.k)}</td><td class="${x.choice===1?'red-ink':'blue-ink'}"><strong>${this.color(x.choice)}</strong>${x.k===0?'<small>Tie → own clue</small>':''}</td></tr>`).join('')}</tbody></table>`;
  if(share)out+=`<p class="math-insight">The clue itself is shared: <strong>${this.color(row.signal)}</strong>. It contributes a factor of <strong>${this.factor(row.signal)}</strong>, even ${same?'though both clues produce the same choice':'when the choice already reveals the clue'}. Counting the clue and its choice separately would count the same information twice.</p>`;
  else if(same)out+=`<p class="math-insight">Both clues lead to <strong>${this.color(row.choice)}</strong>. Given this history, that choice is certain under <em>either jar</em>: its likelihood ratio is <strong>1/1 = 1</strong>. The observer learns nothing new about the jar.</p>`;
  else out+=`<p class="math-insight">Different clues lead to different choices. Seeing <strong>${this.color(row.choice)}</strong> therefore reveals a <strong>${this.color(row.choice).toLowerCase()} clue</strong>, giving a likelihood ratio of <strong>${row.choice===1?'(⅔)/(⅓) = 2':'(⅓)/(⅔) = ½'}</strong>.</p>`;
  out+=`<div class="public-update"><span>Observer’s update</span><strong>${this.odds(row.prior)} × ${this.factor(delta)} = ${this.odds(row.publicEvidence)}</strong><span>P(red) = ${this.fraction(row.publicEvidence)} = ${this.percent(row.publicEvidence)}</span></div>`;
  if(reveal)out+=`<p class="math-aside">Actual private clue: <strong>${this.color(row.signal)}</strong>. This person’s own P(red) was ${this.fraction(row.posterior)} = ${this.percent(row.posterior)}. ${share?'Their clue is now available to the next person.':'Only their choice was available to the next person.'}</p>`;
  out+='</div>';
  if(!share&&Math.abs(r.rows[count-1].publicEvidence)>=2)out+='<p class="math-aside">A hundred further choices would leave these public odds unchanged if everyone still follows the same rule and no new clues become public. Identical decisions need not mean identical private beliefs.</p>';
  return out;
 },
 proof(r,reveal,includeCascade){
  const reds=r.rows.filter(x=>x.signal===1).length,blues=r.rows.length-reds,n=r.rows.length,wr=2**reds,wb=2**blues;
  return `<h3>The assumptions that make the arithmetic work</h3><p>R and B mean the red and blue jars. Each has prior probability ½. A clue matches the jar with probability ⅔. <strong>Clues are independent conditional on the jar</strong>—imagine drawing a ball, replacing it, then drawing again. Everyone knows this setup, sees the available history, and chooses the jar with higher posterior probability. At exactly ½, they follow their own clue.</p><h3>Bayes’ rule, in odds form</h3><p>Let H be the observations so far, and x the next observation. Then:</p><div class="formal-equation"><span>P(R | H, x) / P(B | H, x)</span><b>=</b><span>[P(R | H) / P(B | H)]</span><b>×</b><span>[P(x | R, H) / P(x | B, H)]</span></div><p>The first bracket is the old odds. The second is the <strong>likelihood ratio</strong>: how much more likely this observation is under R than B. The common normalization P(x | H) cancels when the two versions of Bayes’ rule are divided.</p><table class="branch-table likelihood-table"><caption>Likelihoods of a fresh private clue</caption><thead><tr><th scope="col">Observation</th><th scope="col">If jar is R</th><th scope="col">If jar is B</th><th scope="col">Multiplier</th></tr></thead><tbody><tr><th scope="row">Red clue</th><td>⅔</td><td>⅓</td><td>2</td></tr><tr><th scope="row">Blue clue</th><td>⅓</td><td>⅔</td><td>½</td></tr></tbody></table><p>Independent clues let us multiply these ratios. <strong>Choices are dependent on earlier choices</strong>, so we must calculate P(choice | jar, history). We cannot treat every red choice as a fresh red clue.</p>${includeCascade?`<h3>Why the cascade starts at 4 : 1</h3><p>Write the public red-to-blue odds as 2<sup>k</sup>. A red clue adds 1 to k; a blue clue subtracts 1. If k is −1, 0, or 1, the choice reveals the clue under our tie rule. If k ≥ 2, even a blue clue leaves k − 1 ≥ 1, so both clues lead to red. If k ≤ −2, both lead to blue.</p><p>Once both clues give the same choice, its conditional likelihood is 1 under either jar. Multiplying by 1 leaves k unchanged. This proves, by induction, why later choices keep repeating without increasing public confidence.</p><h3>Check the story’s eight-red-choice history directly</h3><p>With only choices visible, eight red choices occur exactly when the first two clues are red. The other six clues can be anything: their probabilities sum to 1.</p><div class="formal-equation">P(8 red choices | R) = (⅔)² = 4/9<br>P(8 red choices | B) = (⅓)² = 1/9<br>P(R | 8 red choices) = (4/9) / (4/9 + 1/9) = <strong>4/5 = 80%</strong></div><p>The tempting 2<sup>8</sup> = 256 : 1 calculation would be valid for eight independent red <em>clues</em>. It is invalid for eight red choices in this story.</p>`:''}${reveal?`<h3>Check the actual envelopes directly</h3><p>This order contains ${reds} red clues and ${blues} blue clues. Its likelihood under R is (⅔)<sup>${reds}</sup>(⅓)<sup>${blues}</sup> = ${wr}/${3**n}. Under B, it is (⅓)<sup>${reds}</sup>(⅔)<sup>${blues}</sup> = ${wb}/${3**n}.</p><div class="formal-equation">P(R | all clues) = ${wr}/(${wr} + ${wb}) = <strong>${this.fraction(r.allClues)} = ${this.percent(r.allClues)}</strong></div><p>The equal priors and common denominator cancel. If we observed only the counts rather than this exact order, the same binomial coefficient would occur in both likelihoods and cancel too. Reordering the clues therefore changes no one’s posterior <em>once all clues are visible</em>.</p>`:''}<p class="math-aside">These are exact results for this model, not a claim that every real crowd behaves this way. Unequal priors, different clue strengths, shared sources, mistakes, or a different tie rule can change the result. A cascade can also be correct; confidence is not certainty.</p><p class="math-citation">Further reading: <a href="https://www.aeaweb.org/articles?id=10.1257/jep.10.4.187" target="_blank" rel="noopener">Anderson & Holt’s classroom experiment</a> and <a href="https://www.aeaweb.org/articles?id=10.1257/jel.20241472" target="_blank" rel="noopener">Bikhchandani et al.’s review of social learning</a>. The calculations above are derived for this game’s stated assumptions.</p>`;
 }
};

/* Invented everyday situations: applications of the model, not historical claims. */
const RumorLife={
 cases:{
  news:{label:'A repeated headline',title:'Five articles. One original claim.',body:'Five sites say a new battery lasts twice as long. Each article sounds confident. You are about to share the news.',quotes:['“Twice as long!”','“A breakthrough.”','“Everyone says so.”'],people:['Site A','Site B','Site C'],question:'What is the most useful next step?',options:[['count','Treat five articles as five confirmations'],['trace','Find the original test and who checked it'],['reject','Assume a popular claim must be false']],correct:'trace',result:'Trace the claim before multiplying your confidence.',explanation:'Five articles may all quote one press release. That is one source repeated, not five independent tests. Find the original measurements, their conditions, and any independent replication. The claim could still be true.',pitfall:'Mistaking the number of links for the number of observations.',habit:'Before sharing: open the original source, check what was measured, and say what remains unverified.',sentence:'“These articles cite the same test. Has anyone independently reproduced it?”'},
  shopping:{label:'A product recommendation',title:'Your friends agree. Did they try it?',body:'Several friends recommend a camera. They all watched the same review; none has used it in low light, which matters most to you.',quotes:['“Great camera.”','“I saw that review.”','“Me too!”'],people:['A friend','Another friend','You'],question:'What would add the most useful evidence?',options:[['more','Ask more people who watched that review'],['test','Look for relevant first-hand tests or try it'],['opposite','Buy the other camera to avoid the herd']],correct:'test',result:'Look for a new observation that answers your question.',explanation:'A first-hand low-light test can add evidence the repeated recommendation lacks. Check that the tester’s needs and conditions match yours. Independence helps, but an irrelevant or unreliable test is still weak evidence.',pitfall:'Treating borrowed confidence as personal experience—or copying someone else’s priorities.',habit:'Ask “Did you use it yourself, and under what conditions?” Separate their observation from their recommendation.',sentence:'“What did you personally try? I care about indoor photos, not daytime video.”'},
  meeting:{label:'A team meeting',title:'The leader speaks. Everyone nods.',body:'A team is deciding whether a release will be ready on Tuesday. The lead says yes first. Everyone else hears that before giving an estimate.',quotes:['“Tuesday is fine.”','“Sounds right.”','“I agree.”'],people:['Team lead','A teammate','Another teammate'],question:'How would you improve the next discussion?',options:[['leader','Have the most senior person explain first'],['private','Write estimates and evidence before discussion'],['vote','Keep voting until everyone agrees']],correct:'private',result:'Collect independent starting points, then discuss the reasons.',explanation:'Ask everyone to write an estimate, a concrete observation, and an uncertainty before seeing others’ answers. Reveal them together, investigate differences, and update. Do not merely average every opinion: expertise and evidence quality matter.',pitfall:'Losing a person’s private concern inside their public agreement.',habit:'As a leader, give others space to report evidence before you anchor the room. As a teammate, share the observation even if your final recommendation agrees.',sentence:'“I also lean Tuesday, but two tests still fail. Here is what would change my estimate.”'}
 },
 render(d){
  const key=d.lifeCase||'news',q=this.cases[key],answer=d.lifeAnswers?.[key],count=Object.keys(d.lifeAnswers||{}).length;
  const people=q.people.map((name,i)=>{const x=140+i*220;return `<path d="M${x-90} 20h180v46h-61l-14 15V66h-105z" fill="#f8f6ee" stroke="#a4b4a3" stroke-width="1.5"/>${U.text(x,48,q.quotes[i],'svg-small')}${U.person(x,111,['#d8aa88','#92b2a8','#b09bb5'][i],.74,'hmm',{id:'everyday-'+i})}${U.text(x,212,name,'svg-small')}`}).join('');
  const art=`<div class="life-tabs" role="group" aria-label="Everyday situations">${Object.entries(this.cases).map(([k,v])=>U.button((d.lifeAnswers?.[k]?'✓ ':'')+v.label,'life-case',k,k===key?'selected':'secondary')).join('')}</div><div class="life-scene"><h2>${q.title}</h2><p>${q.body}</p>${U.svg(q.people.map((p,i)=>p+' says '+q.quotes[i]).join('. '),people,235)}</div>`;
  const controls=!answer?U.choices(q.question,q.options,'life-answer'):`<div class="choices">${U.button('Try this situation again','life-retry','','secondary')}</div>`;
  const feedback=answer?U.feedback(q.result,q.explanation,answer===q.correct):'';
  const application=answer?`<div class="life-application"><p><span class="life-label">THE PITFALL</span>${q.pitfall}</p><p><span class="life-label">A BETTER HABIT</span>${q.habit}</p><blockquote>${q.sentence}</blockquote></div>`:'';
  const takeaway=`<div class="life-principles"><h2>How to behave when everyone agrees.</h2><ol><li><strong>Bring your evidence, even when you agree.</strong> “I saw X” gives the group more than another “yes.”</li><li><strong>Count origins and weigh quality.</strong> Ten repetitions of one observation are not ten tests. Independent expert work deserves weight.</li><li><strong>Make room to update.</strong> Name what would change your mind. Revise your view when better evidence arrives.</li></ol><p>Neither agreement nor disagreement is a guarantee. The aim is a well-supported belief, not automatic conformity or automatic contrarianism.</p><p class="note">These are illustrative applications. Real sources have unequal expertise, partial overlap, and uncertain reliability; the game’s exact percentages do not transfer to them.</p></div>`;
  return U.scene({eyebrow:'Take the lesson into your day',title:'Ask what they saw. Share what you saw.',body:'The crowd was made of reasonable people. Better conversations make their evidence visible. Try these three everyday situations.',art,controls,feedback,after:application+`<p class="life-progress">${count} of 3 situations explored</p>`+takeaway+`<div class="choices">${U.button('Open the sandbox','lab')}<a class="btn secondary" href="../small-worlds/">Choose another world →</a></div>`});
 },
 act(a,v,d){if(a==='life-case')d.lifeCase=v;if(a==='life-answer')(d.lifeAnswers||={})[d.lifeCase||'news']=v;if(a==='life-retry')delete (d.lifeAnswers||={})[d.lifeCase||'news'];}
};

/* Original, optional explanations. Nutshell itself is vendored without changes. */
window.SmallWorldNotes = (() => {
 const anchor = key => key.toLowerCase().replace(/[^a-z0-9]/g,'');
 const link = (key, label) => `<a href="#${anchor(key)}">:${label}</a>`;
 const entries = {
  Sandbox: `<p>A sandbox is the part where you get to change the rules. Add a barista, change a reward, or give the crowd different clues. Ask “what if?” and watch what follows.</p><p>Try changing <em>one thing at a time</em>. That makes it easier to see what caused the difference. Each game is a ${link('Model','model')}, with its assumptions listed underneath.</p>`,
  Model: `<p>A model is a small world with explicit rules. We leave things out so one mechanism becomes easier to see.</p><p>A toy café can show how bursts create a queue. It does not know your local café’s staffing costs, impatient customers, or broken espresso machine.</p><p><strong>The useful question:</strong> “Which assumptions would need to hold for this lesson to apply here?”</p>`,
  'Independent clues': `<p>Imagine drawing a clue, replacing it, and mixing the jar before the next draw. Once you know which jar is being used, seeing one person’s draw does not tell you what the next draw will be.</p><p>That is what <em>independent conditional on the jar</em> means here. The same hidden jar can still make the clues tend to agree. Independence does not mean disagreement.</p><p>A copied report is different: it reuses an observation instead of creating one. In everyday life, ask about ${link('Independent evidence','independent evidence')}.</p>`,
  'Independent evidence': `<p>Five articles repeating one battery test are still describing <strong>one test</strong>. Five labs making their own measurements can bring new evidence.</p><p>“Independent” is not a magic quality stamp. The labs might share a faulty instrument or the same bad assumption. Check their methods as well as their origins.</p><p><strong>Try saying:</strong> “What did each source actually observe, and what do they all rely on?”</p>`,
  Odds: `<p>Odds compare the two possibilities directly. Odds of <strong>3 : 1</strong> mean three parts for one possibility and one part for the other: 3 out of 4, or 75%.</p><p>To turn odds of <em>a : b</em> into a probability for the first possibility, use <strong>a / (a + b)</strong>.</p><p>New evidence can change those odds. Repeating the same evidence is not another independent update.</p>`,
  'Information cascade': `<p>An information cascade begins when someone’s best choice is the same whichever private clue they received. Their public choice then stops revealing that clue.</p><p>The person can be reasoning sensibly. But later people see the agreement without seeing the private evidence it hides. A cascade can support a true belief or a false one.</p><p>The repair is to share observations, not merely votes. That lets ${link('Independent clues','fresh clues')} reach the group.</p>`,
  'Weighted average': `<p>Imagine making a blend. The result depends on the ingredients <em>and how much of each you use</em>. A percentage works the same way.</p><p>In the original repair-shop mix, Mira gets 20 easy jobs and 80 difficult ones:</p><p><strong>20% × 90% + 80% × 60% = 66%.</strong></p><p>The weights, 20% and 80%, are the shares of all jobs. You cannot simply average 90% and 60% unless the two groups are equally large.</p><p>To compare the rates for identical work, give both shops a ${link('Common mix','common mix')}.</p>`,
  'Common mix': `<p>Choose one basket of work and apply each shop’s rates to that same basket.</p><p>For 50 easy and 50 difficult jobs, Mira’s score is <strong>75%</strong> and Sol’s is <strong>65%</strong>. These are hypothetical standardized scores, not a new batch of observed repairs.</p><p>Another common mix can change both scores. Here Mira still leads by 10 ${link('Percentage points','percentage points')}, because its advantage is 10 points in each group.</p>`,
  'Percentage points': `<p>A move from 60% to 70% is an increase of <strong>10 percentage points</strong>.</p><p>The relative increase is different: 10 ÷ 60 ≈ 16.7%. “Ten percent better” is ambiguous unless you say which comparison you mean.</p>`,
  'Simpsons paradox': `<p>One option can lead in every group yet trail when the groups are combined. The totals and the group comparisons can all be correct.</p><p>The trick is that the two totals use <em>different mixtures</em>. The better shop can get enough difficult work to pull its overall rate below the other shop’s.</p><p>Look at the ${link('Weighted average','weights inside the average')}. Then ask which comparison answers your actual question.</p>`,
  Confounder: `<p>A confounder is a shared cause of the thing you are comparing and the outcome.</p><p>Here, job difficulty affects which shop receives a bike <em>and</em> whether it gets fixed. The shops therefore start with different kinds of work.</p><p>Comparing similar difficulties addresses that particular mismatch. It does not guarantee that every other relevant difference has disappeared.</p>`,
  Mediator: `<p>A mediator is part of the pathway through which something has an effect.</p><p>Suppose coaching causes more practice, which improves scores. If you compare only people with equal practice time, you can remove part of the very benefit you wanted to measure.</p><p>For the coaching program’s <em>total</em> effect, include the paths through which it helps. This is why “always split into more groups” is not a safe rule.</p>`
 };
 const N = window.Nutshell;
 N.setOptions({startOnLoad:false,dontEmbedHeadings:true});
 N.addStyles();

 // Only our authored, embedded notes are accepted. No remote fetching, Markdown
 // input, URL-supplied text, iframe fallback, or parent-window messaging is used.
 const noteHTML = Object.entries(entries).map(([title,body])=>`<h2>${title}</h2>${body}`).join('');
 const safeHTML = DOMPurify.sanitize(noteHTML,{FORBID_ATTR:['style','id','class'],FORBID_TAGS:['style']});
 N.promisePurifiedHTMLFromURL = () => Promise.resolve(safeHTML);
 const getSection = N.promiseSectionContainer;
 N.promiseSectionContainer = expandable => {
  const url = new URL(expandable.href,location.href);
  const current = new URL(location.href);
  if(url.origin!==current.origin || url.pathname!==current.pathname || url.search!==current.search || !Object.keys(entries).some(key=>anchor(key)===anchor(url.hash.slice(1)))) {
   const message=document.createElement('p');message.textContent='This explanation is not available.';
   return Promise.resolve(message);
  }
  return getSection(expandable);
 };

 // Keep upstream's nested expansions while making the controls keyboard-usable.
 let serial=0;
 const convert=N.convertLinksToExpandables;
 N.convertLinksToExpandables=(root,parent)=>{
  convert(root,parent);
  root.querySelectorAll('.nutshell-expandable').forEach(ex=>{
   if(ex.dataset.notesReady)return;
   ex.dataset.notesReady='true';ex.id='note-link-'+(++serial);
   ex.setAttribute('role','button');ex.setAttribute('aria-expanded','false');
   ex.removeAttribute('target');
   const open=ex.open,close=ex.close;
   ex.open=event=>{
    if(ex.isOpen)return;
    // Game rendering reuses this note node, so pausing cannot interrupt its click.
    if(typeof isRunning==='function' && isRunning()){stop();Sound.silence();render();}
    const rect=ex.getClientRects()[0]||ex.getBoundingClientRect();
    open(!event||event.detail===0?{clientX:rect.x+rect.width/2}:event);
    ex.setAttribute('aria-expanded','true');
   };
   ex.close=()=>{
    if(!ex.isOpen)return;
    const bubble=document.getElementById(ex.getAttribute('aria-controls'));
    bubble?.querySelectorAll('.nutshell-expandable').forEach(child=>{child.isOpen=false;child.setAttribute('aria-expanded','false');});
    close();ex.setAttribute('aria-expanded','false');ex.removeAttribute('aria-controls');ex.focus({preventScroll:true});
   };
   ex.addEventListener('keydown',event=>{
    if(event.key===' '){event.preventDefault();ex.click();}
    if(event.key==='Escape'&&ex.isOpen){event.preventDefault();event.stopPropagation();ex.close();}
   });
  });
 };
 const createBubble=N.createBubble;
 N.createBubble=(ex,x)=>{
  const bubble=createBubble(ex,x);
  bubble.id='note-bubble-'+(++serial);bubble.setAttribute('role','region');
  bubble.setAttribute('aria-label',ex.textContent.trim());
  ex.setAttribute('aria-controls',bubble.id);
  const close=bubble.querySelector('.nutshell-bubble-overflow-close');
  close.textContent='Close explanation ↑';close.setAttribute('aria-label','Close '+ex.textContent.trim()+' explanation');
  // Upstream's scroll-on-close animates even in reduced-motion mode.
  close.onclick=()=>{ex.close();if(ex.getBoundingClientRect().top<0)ex.scrollIntoView({block:'center',behavior:'instant'});};
  bubble.addEventListener('keydown',event=>{
   if(event.key==='Escape'){event.preventDefault();event.stopPropagation();ex.close();}
  });
  return bubble;
 };

 // A native, in-flow close-all button replaces the upstream floating div.
 // Count the actual attached links so removed chapters cannot leave stale UI.
 N._updateCloseAllNutshells=()=>{
  const open=[...document.querySelectorAll('.sw-notes .nutshell-expandable')].filter(ex=>ex.isOpen);
  N._nutshellsOpen=open.length;
  document.querySelectorAll('.notes-close-all').forEach(b=>b.hidden=open.length<2);
 };
 function decorate(panel){
  N.convertLinksToExpandables(panel);
  const close=document.createElement('button');close.className='textbtn notes-close-all';close.textContent='Close all explanations';close.hidden=true;
  close.addEventListener('click',()=>{
   const tops=[...panel.querySelectorAll('.nutshell-expandable')].filter(ex=>ex.isOpen&&!ex.closest('.nutshell-bubble'));
   tops.forEach(ex=>ex.close());tops[0]?.focus({preventScroll:true});
  });
  panel.append(close);
 }
 function sentence(){
  if(S.sandbox)return G.slug==='everyone-says'?`A little help with ${link('Odds','odds')} and ${link('Independent clues','independent clues')}.`:`A little help with ${link('Weighted average','weighted averages')}.`;
  if(G.slug==='everyone-says'){
   if(S.chapter===0)return `One assumption to unpack: ${link('Independent clues','independent clues')}.`;
   if(S.chapter===1)return `A little help with ${link('Odds','odds')}.`;
   if(S.chapter===2&&data().confidence)return `There’s a name for this: an ${link('Information cascade','information cascade')}.`;
   if(S.chapter===5&&data().traced)return `What counts as ${link('Independent evidence','independent evidence')}?`;
   if(S.chapter===6)return `A useful distinction: ${link('Independent evidence','independent evidence')} is more than repeated agreement.`;
  }
  if(G.slug==='average-that-lied'){
   if(S.chapter===1&&data().easy&&data().hard)return `You’ve uncovered ${link('Simpsons paradox','Simpson’s paradox')}.`;
   if(S.chapter===2)return `The moving part is a ${link('Weighted average','weighted average')}.`;
   if(S.chapter===3)return `Compare the same recipe: a ${link('Common mix','common mix')}.`;
   if(S.chapter===4&&data().answers?.before&&data().answers?.after)return `Two different roles: ${link('Confounder','confounder')} and ${link('Mediator','mediator')}.`;
   if(S.chapter===5&&data().choice)return `A useful distinction: ${link('Percentage points','percentage points')} versus percent change.`;
   if(S.chapter===6)return `Revisit the mechanism: ${link('Weighted average','weighted averages')}.`;
  }
  return '';
 }
 let panel=null,key='';
 return {
  detach(reset=false){
   if(reset){panel=null;key='';}
   else panel?.remove();
  },
  mount(){
   const text=sentence(),next=`${G.slug}/${S.sandbox?'lab':S.chapter}/${text}`;
   if(next!==key){panel=null;key=next;}
   if(!text){N._updateCloseAllNutshells();return;}
   if(!panel){panel=document.createElement('aside');panel.className='sw-notes';panel.setAttribute('aria-label','Optional explanations');panel.innerHTML=`<p>${text}</p>`;}
   document.querySelector('.scene-head').append(panel);
   if(!panel.querySelector('.nutshell-expandable'))decorate(panel);
   const sources=document.querySelector('.sources');
   if(sources&&!sources.querySelector('.notes-credit')){const credit=document.createElement('p');credit.className='notes-credit';credit.innerHTML='Expandable explanations use <a href="https://ncase.me/nutshell/" target="_blank" rel="noopener">Nutshell by Nicky Case</a>. <a href="../small-worlds/THIRD-PARTY-NOTICES.txt">Open-source notices</a>.';sources.append(credit);}
   N._updateCloseAllNutshells();
  },
  collection(){
   const panel=document.querySelector('.collection-notes');
   if(panel){panel.classList.add('sw-notes');decorate(panel);}
  }
 };
})();

let S,timer=null;
const KEY='small-worlds-v1-'+G.slug;
function fresh(){return {version:1,chapter:0,unlocked:0,chapters:{},lab:structuredClone(G.initialLab),sandbox:false,completed:false,calm:matchMedia('(prefers-reduced-motion: reduce)').matches};}
try{const raw=JSON.parse(localStorage.getItem(KEY));S=raw&&raw.version===1?{...fresh(),...raw,lab:{...G.initialLab,...raw.lab}}:fresh();if(!Number.isInteger(S.chapter)||S.chapter<0||S.chapter>=G.chapters.length||typeof S.chapters!=='object')S=fresh();}catch{S=fresh();}
function data(){return S.sandbox?S.lab:(S.chapters[S.chapter]||=( {} ));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch{}}
function stop(){if(timer)clearInterval(timer);timer=null;}
function isRunning(){return timer!==null;}
function animate(end,ms){stop();const target=data();if(S.calm){target.tick=end;render();return;}timer=setInterval(()=>{target.tick=Math.min(end,(target.tick||0)+1);if(target.tick===end)stop();render();},ms);}
function animateCafe(){stop();const target=data();if(S.calm){target.minute=240;target.tick=12;render();return;}let last=performance.now();timer=setInterval(()=>{const now=performance.now(),dt=Math.min(.2,(now-last)/1000);last=now;target.minute=Math.min(240,(target.minute??(target.tick||0)*20)+dt*(target.speed||2));target.tick=target.minute/20;if(target.minute>=240)stop();render();},90);}
function render(moveFocus=false){
 const motion=Motion.before(),focus=document.activeElement?.id;
 window.SmallWorldNotes?.detach(moveFocus);
 const scene=G.render();document.body.classList.toggle('calm',S.calm);
 document.getElementById('app').innerHTML=scene.html+(scene.ready?`<div class="nextrow"><span class="hint">${S.chapter===G.chapters.length-2?'A new setting, the same idea.':'Your next decision builds on this one.'}</span>${U.button(scene.next||'Keep going →','next')}</div>`:'')+`<nav class="progress" aria-label="Story chapters">${G.chapters.map((name,i)=>`<button class="${i===S.chapter&&!S.sandbox?'current ':''}${i<=S.unlocked?'visited':''}" data-do="goto" data-value="${i}" ${i>S.unlocked?'disabled':''} aria-label="Chapter ${i+1}: ${name}" ${i===S.chapter&&!S.sandbox?'aria-current="step"':''}></button>`).join('')}</nav><p class="chapter-meta">${S.sandbox?'SANDBOX · your rules':`${String(S.chapter+1).padStart(2,'0')} / ${String(G.chapters.length).padStart(2,'0')} · ${G.chapters[S.chapter]}`}</p><details class="sources"><summary>Inside this little world: assumptions & sources</summary><p>${G.model}</p><ul>${G.sources.map(([name,url])=>`<li><a href="${url}" target="_blank" rel="noopener">${name} ↗</a></li>`).join('')}</ul><p>Original art and simulation. Inspired by the learning-through-play structure of <a href="https://ncase.me/trust/" target="_blank" rel="noopener">The Evolution of Trust</a> by Nicky Case. No accounts or tracking. Progress is stored only in this browser.</p></details>`;
 document.getElementById('mode').textContent=S.sandbox?'Return to story':'Sandbox';
 document.getElementById('motion').textContent=S.calm?'Motion off':'Motion on';
 document.getElementById('motion').setAttribute('aria-pressed',String(!S.calm));
 document.getElementById('back').hidden=S.sandbox||S.chapter===0;
 document.getElementById('restart-chapter').textContent=S.sandbox?'Reset sandbox':'Restart chapter';
 document.getElementById('restart-chapter').hidden=!S.sandbox&&S.chapter===G.chapters.length-1&&!G.finalInteractive;
 window.SmallWorldNotes?.mount();
 if(moveFocus){document.getElementById('scene-title').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}else if(focus){document.getElementById(focus)?.focus({preventScroll:true});}
 Sound.update();Motion.after(motion);save();
}
function go(c){stop();Sound.play(c===G.chapters.length-1?'complete':'page');S.sandbox=false;S.chapter=c;S.unlocked=Math.max(S.unlocked,c);if(c===G.chapters.length-1)S.completed=true;render(true);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-do]');if(!b||b.disabled)return;const a=b.dataset.do,v=b.dataset.value;
 if(a==='sound'){Sound.set(!Sound.enabled);if(Sound.enabled)Sound.play('on');return;}
 Sound.init();
 if(a==='next'){if(G.render().ready)go(Math.min(G.chapters.length-1,S.chapter+1));return;}
 if(a==='back'){go(Math.max(0,S.chapter-1));return;}
 if(a==='goto'){const n=Number(v);if(n<=S.unlocked)go(n);return;}
 if(a==='lab'){stop();S.sandbox=!S.sandbox;render(true);return;}
 if(a==='motion'){S.calm=!S.calm;if(S.calm&&timer)stop();render();return;}
 if(a==='pause'){stop();Sound.silence();render();return;}
 if(a==='restart-chapter'){stop();Sound.silence();if(S.sandbox)S.lab=structuredClone(G.initialLab);else delete S.chapters[S.chapter];Sound.play('page');render(true);return;}
 if(a==='restart'){stop();Sound.silence();render();document.getElementById('reset-confirm').showModal();return;}
 if(a==='cancel-reset'){document.getElementById('reset-confirm').close();return;}
 if(a==='confirm-reset'){stop();Sound.silence();const calm=S.calm;S={...fresh(),calm};document.getElementById('reset-confirm').close();render(true);return;}
 G.act(a,v);Sound.action(a);render();if(a==='play'&&G.slug==='little-cafe')document.querySelector('.cafe-dashboard')?.scrollIntoView({block:'start',behavior:'instant'});
});
document.addEventListener('input',e=>{if(e.target.matches('input[type=range][data-key]'))document.getElementById('out-'+e.target.dataset.key).textContent=e.target.value+(e.target.dataset.unit||'');});
document.addEventListener('change',e=>{if(!e.target.dataset.key)return;stop();G.change(e.target.dataset.key,e.target.value);Sound.play('tap');render();});
window.addEventListener('pagehide',()=>{stop();Sound.silence();save();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();Sound.silence();render();}});
window.addEventListener('storage',e=>{if(e.key==='small-worlds-sound'){Sound.enabled=Sound.read();if(!Sound.enabled)Sound.silence();Sound.update();}});
window.SmallWorlds={getState:()=>structuredClone(S),model:Models,game:G.slug};
render();
</script></body></html>
