","701 BCE","Kingdom of Judah","Assyrian besiegers","Judean defenders",["ram","archer"],"siege",[["A city behind stone","Lachish guards an important Judean route. Its walls make a direct assault costly."],["Build a road to the wall","Assyrian laborers build a siege ramp. Protected engines, archers and infantry put pressure on the defenses together."],["Capture, then deportation","The city falls. Assyrian reliefs celebrate victory and show captives: conquest also means displacement and imperial intimidation."]],"https://www.britishmuseum.org/collection/galleries/assyria-lion-hunts","The royal reliefs and surviving siege ramp provide evidence, but the reliefs are designed to glorify the king.")]),Wt("classical","The organized battlefield","600\u2013300 BCE","A weapon becomes powerful inside a formation.",[["hoplite","Hoplite","Shield + thrusting spear","Front strong; flanks exposed"],["pike","Macedonian sarissa","Overlapping spearpoints","Needs cohesion and support"],["galley","Trireme","Oars + a bronze ram","Crew skill and sea room"]],["A moving wall","Close-order infantry presents many spearpoints together. Trust, rhythm and protected sides matter as much as individual strength.","line","Fix, then turn.","Macedonian infantry holds attention while cavalry looks for a decisive opening. Different arms solve different problems.","flank"],["Rowers are the engine","Naval power requires trained crews, timber, wages and ports. A fleet can protect supply routes far beyond one battlefield."],[Oe("marathon","Marathon","490 BCE","Attica, Greece","Athens & Plataea","Achaemenid Persia",["hoplite","archer"],"encircle",[["An invasion on the coast","Persian forces land near Athens. The Greeks stretch their line, strengthening the wings while thinning the center."],["The wings come inward","The Greek center gives ground. Successful wings turn inward against the Persian center; survivors retreat to the ships."],["Athens survives this invasion","The Greeks win and hurry back to protect Athens. Persia returns with another invasion ten years later."]],Qt+"marathon/","The whereabouts of the Persian cavalry and the details of the Greek advance are disputed."),Oe("salamis","Salamis","480 BCE","Saronic Gulf","Allied Greek fleet","Persian imperial fleet",["galley","galley"],"strait",[["Numbers need room","After Athens is evacuated and burned, the Greek fleet gathers in confined water near Salamis."],["Fight inside the strait","The larger Persian fleet struggles to deploy. Greek ships ram and board in a compressed, confused battle."],["Sea control changes the campaign","A Greek victory disrupts the invasion. Persian land forces remain; the war in Greece is decided the following year."]],Qt+"Battle_of_Salamis/","This is a schematic of confinement, not a reconstruction of every ship; ancient fleet totals vary."),Oe("gaugamela","Gaugamela","331 BCE","Mesopotamia","Alexander \xB7 Macedonians","Darius III \xB7 Persians",["pike","cavalry"],"gap",[["The king prepares open ground","Darius chooses a broad plain for cavalry and chariots. Alexander must avoid being surrounded."],["A gap near the center","Alexander shifts right, drawing Persian forces outward, then leads cavalry toward an opening near Darius."],["A battle opens an empire","Darius withdraws; the Persian army loses cohesion. Alexander gains the imperial heartland, but years of campaigning remain."]],Qt+"Battle_of_Gaugamela/","The exact site, troop numbers, and some maneuvers are uncertain. The chariot attack is only one part of the battle.")]),Wt("empires","Legions, engineers & rivers","300 BCE\u2013300 CE","Organization can outlast a battlefield disaster.",[["legion","Roman legionary","Javelin, shield, sword","Depends on unit discipline"],["crossbow","Han crossbow","Stored mechanical force","Reloading takes time"],["ram","Military engineering","Roads, camps, siege works","Labor and supply intensive"]],["Smaller units, shared discipline","Roman formations use subdivisions and reserves. Commanders can reinforce a threatened section rather than commit every soldier at once.","reserve","The river is a road.","In China, armies and grain move along waterways. Controlling a crossing or fleet can shape an entire campaign.","river"],["Victory has a second scale","A battle destroys a force. A war also depends on alliances, manpower, finance and the willingness to keep fighting."],[Oe("cannae","Cannae","216 BCE","Southern Italy","Hannibal \xB7 Carthaginians","Roman consular army",["spear","legion"],"encircle",[["Rome concentrates in the center","A deep Roman infantry mass faces Hannibal. His center projects forward; stronger infantry and cavalry guard the wings."],["The center bends; the wings close","As Romans push inward, Hannibal\u2019s flanks turn against them. Victorious cavalry returns against the Roman rear."],["A catastrophe, not surrender","The Roman army is encircled and shattered. Rome keeps raising armies and holding allies; Carthage eventually loses the war."]],Qt+"Battle_of_Cannae/","The classic double-envelopment diagram is an interpretive model based on ancient accounts; exact numbers are disputed."),Oe("alesia","Alesia","52 BCE","Gaul","Caesar \xB7 Romans","Vercingetorix & relief army",["legion","spear"],"double-siege",[["Besiege the hilltop town","Caesar surrounds Vercingetorix at Alesia. A Gallic relief army creates a second threat outside the Roman position."],["Two walls, two directions","Roman works face both inward and outward. Mobile reserves reinforce weak points as attacks converge."],["Relief fails; the town surrenders","Caesar wins a decisive campaign victory. Resistance continues elsewhere; conquest brings enslavement and immense suffering."]],Qt+"article/1734/battle-of-alesia/","Caesar is a principal source and a political self-promoter. His enormous enemy totals should not be taken literally."),Oe("red-cliffs","Red Cliffs","208 CE","Yangtze River, China","Sun Quan & Liu Bei","Cao Cao",["junk","junk"],"fireships",[["A northern army goes south","Cao Cao seeks control of southern China. An allied fleet resists on the Yangtze; illness weakens his forces."],["Fire breaks the fleet","An attack with burning vessels helps throw Cao Cao\u2019s fleet into disorder. The allies exploit the retreat."],["Unification is delayed","Cao Cao withdraws north. The result helps preserve the rival powers that become the Three Kingdoms."]],Qt+"Battle_of_Red_Cliffs/","Later fiction greatly embellishes this battle. Weather tricks, exact fleet arrangements and troop totals are not secure history.")]),Wt("frontiers","Horsemen & changing empires","300\u20131000","Mobility is a system, not a single invention.",[["cavalry","Armored horseman","Shock + movement","Horses need food and care"],["horseArcher","Mounted archer","Shoot and reposition","Years of practiced skill"],["spear","Infantry & spear","Hold difficult ground","Must coordinate with horsemen"]],["Keep a reserve in motion.","Cavalry can reinforce, threaten a flank or pursue. Infantry, terrain and timing decide whether a charge succeeds.","reserve","A coalition is a weapon.","Empires fight with allies and frontier peoples. Loyalty, coordination and local knowledge can decide the encounter.","flank"],["The horse has a supply line","Remounts, pasture and water set the limits of mobility. Stirrups help riders; they do not explain every military change."],[Oe("adrianople","Adrianople","378","Thrace","Goths & allies","Valens \xB7 Eastern Romans",["cavalry","legion"],"ambush",[["A rushed confrontation","Valens approaches a Gothic wagon camp without waiting for reinforcements. Heat, fatigue and incomplete information shape the encounter."],["Horsemen return to the fight","Gothic and allied cavalry arrive while the battle develops. Roman formations become compressed and overwhelmed."],["An emperor is killed","Valens and much of his field army are lost. The Roman state survives; cavalry has not suddenly made infantry obsolete."]],Qt+"Battle_of_Adrianople/","Ammianus is central to the reconstruction. This was not the instant end of the Roman Empire."),Oe("yarmouk","Yarmouk","636","Southern Syria","Rashidun army","Byzantine army",["cavalry","spear"],"flank",[["An empire tries to recover Syria","Byzantine forces confront Arab armies near the Yarmouk. Both sides operate within difficult terrain and coalition politics."],["Pressure on the flanks","Accounts emphasize Khalid\u2019s mobile cavalry and coordinated counterattacks. The Byzantine army loses cohesion and routes of retreat."],["Control of Syria changes","A decisive Rashidun victory ends the Byzantine effort to recover most of Syria. Further conquests follow."]],Mi+"Battle_of_the_Yarmuk","Detailed day-by-day maneuvers come from later accounts. The diagram shows the broad interpretation, not a certain six-day sequence."),Oe("talas","Talas","751","Central Asia","Abbasids & Karluks","Tang expedition",["cavalry","crossbow"],"defection",[["Local rivalries draw in empires","Tang and Abbasid power meet through competing Central Asian allies. Neither army fights in isolation."],["The coalition comes apart","Karluk forces turn against the Tang army, which is attacked from more than one direction."],["Defeat, then a larger upheaval","The Tang force retreats. The An Lushan rebellion later does more to curtail western ambitions than this battle alone."]],Mi+"Battle_of_Talas","Karluk allegiance and battlefield details are debated. The popular claim that this battle alone spread papermaking is too simple.")]),Wt("medieval","Castles, knights & bows","1000\u20131500","A knight is formidable. A battlefield is bigger.",[["knight","Lance & armor","Protected mounted shock","Needs space and support"],["archer","Longbow","Rapid archery by specialists","Training, ammunition, weather"],["trebuchet","Trebuchet","Heavy projectiles for sieges","Transport and construction"]],["Combined arms, medieval style","Foot soldiers anchor the position; archers disrupt; cavalry exploits. Commanders rarely have a force of knights alone.","combined","Make the ground an ally.","Slopes, mud, stakes and constricted fronts can reduce a mounted force\u2019s freedom to move.","choke"],["Most war is not a famous charge","Raiding, garrisons and sieges dominate much medieval campaigning. Castles control people, routes, harvests and time."],[Oe("hastings","Hastings","1066","England","William \xB7 Normans","Harold \xB7 English",["knight","spear"],"hill",[["A shield wall on high ground","Harold\u2019s infantry holds a ridge. William brings cavalry, infantry and archers against the position."],["The line loses its cohesion","Repeated attacks and retreats draw some English troops downhill. Gaps give Norman troops opportunities to break in."],["A kingdom changes hands","Harold is killed and the English army breaks. William\u2019s conquest still requires years of campaigns and repression."]],"https://www.english-heritage.org.uk/visit/places/1066-battle-of-hastings-abbey-and-battlefield/history-and-stories/what-happened-battle-hastings","The extent of deliberate feigned retreat, and how Harold died, are disputed."),Oe("hattin","Hattin","1187","Galilee","Saladin \xB7 Ayyubids","Kingdom of Jerusalem",["horseArcher","knight"],"thirst",[["Leave the water behind","The crusader army marches from a secure water source toward Tiberias. Saladin\u2019s forces harass it in summer heat."],["Exhaustion before the final fight","Repeated attacks, thirst and constrained movement fragment the crusader army near the Horns of Hattin."],["A field army disappears","Saladin destroys or captures much of the opposing force. Jerusalem falls later that year; some coastal strongholds survive."]],Qt+"Battle_of_Hattin/","Heat, water and harassment mattered together; the diagram compresses a march and battle into one view."),Oe("agincourt","Agincourt","1415","Northern France","Henry V \xB7 English","French royal army",["archer","armored"],"choke",[["A narrow front after rain","Henry\u2019s small, tired army positions archers and men-at-arms between woods, with stakes protecting the bowmen."],["Compression becomes a trap","French attacks cross wet ground under arrows. Crowded men-at-arms struggle as English archers join the close fighting."],["A victory, not the end of the war","England wins; many French nobles die or are captured. The Hundred Years\u2019 War continues, and France eventually prevails."]],"https://royalarmouries.org/objects-and-stories/stories/the-hundred-years-war-1337-1453","Armor could resist arrows. Terrain, exhaustion, crowding and hand-to-hand fighting are essential to the explanation. Prisoners were also killed.")]),Wt("steppe","The steppe meets the city","1200\u20131400","Speed wins campaigns. Adaptation wins sieges.",[["horseArcher","Composite bow","Power from horseback","Skill and remounts"],["cavalry","Lance cavalry","Exploit a broken formation","Needs timing, not just speed"],["trebuchet","Siege specialists","Imported technical expertise","Heavy logistical demands"]],["Retreat can be an invitation.","Disciplined horsemen can withdraw while preserving cohesion, drawing an opponent away from support. Pursuit is not always success.","retreat","The Mongols adapt.","Conquered and recruited engineers, infantry and sailors expand what steppe armies can do. There is no single Mongol battle plan.","siege"],["Communication stretches an army","Scouts, messengers, coordinated columns and remounts extend operational reach. Campaigns also inflict mass killing, destruction and displacement."],[Oe("kalka","Kalka River","1223","Pontic steppe","Mongol expedition","Rus\u2019 & Cuman coalition",["horseArcher","cavalry"],"retreat",[["A coalition follows the withdrawal","A Mongol force draws Rus\u2019 and Cuman troops into a prolonged pursuit. Allied contingents lose mutual support."],["Turn against a divided enemy","The Mongols counterattack as the coalition reaches battle unevenly. Separate forces cannot act as one army."],["The coalition is defeated","The Mongols win, then withdraw east. The large-scale conquest of the Rus\u2019 principalities comes years later."]],Mi+"Battle_of_the_Kalka_River","The precise site is uncertain. The diagram illustrates separation and concentration, not exact marching routes."),Oe("mohi","Mohi","1241","Hungary","Batu & Subutai \xB7 Mongols","B\xE9la IV \xB7 Hungarians",["horseArcher","knight"],"crossing",[["A river protects the camp","The Hungarian army camps near the Saj\xF3. A defended bridge becomes the focus of the first fighting."],["Pressure at more than one crossing","Mongol attacks at the bridge combine with forces crossing elsewhere. Hungarian troops are driven back toward camp."],["A retreat becomes a disaster","The army breaks and B\xE9la escapes. Hungary is devastated; the subsequent Mongol withdrawal has several debated explanations."]],Qt+"article/1453/the-mongol-invasion-of-europe/","Some crossing details are reconstructed from conflicting narratives. \xD6gedei\u2019s death is not a complete explanation of the withdrawal."),Oe("xiangyang","Xiangyang","1267\u20131273","Han River, China","Mongol / Yuan forces","Southern Song defenders",["trebuchet","crossbow"],"river-siege",[["A fortress pair blocks the river","Xiangyang and Fancheng obstruct the route into the Song heartland. Walls and river supply sustain a long defense."],["Close the river; bring heavier engines","Blockade and counterweight trebuchets intensify the siege. Fancheng falls, exposing Xiangyang to greater pressure."],["A gateway opens south","Xiangyang surrenders. The victory enables further Yuan advances; the Southern Song finally falls in 1279."]],Mi+"Battle_of_Xiangyang","Sources differ on when the siege began. The outcome required blockade, engineering and years of effort, not one machine.")]),Wt("gunpowder","Gunpowder travels","1400\u20131600","A new weapon works inside an older system.",[["cannon","Cannon","Batter walls; support armies","Heavy and supply hungry"],["musket","Matchlock","Train large firearm units","Slow reload; exposed crews"],["pike","Pike & barricade","Protect shooters from assault","Limits movement"]],["Firepower needs protection.","Early firearms reload slowly. Pikes, walls, wagons and fieldworks help keep shooters alive while they work.","volley","Walls answer cannon.","Lower, thicker, angled defenses spread across many regions. Military technology creates a contest of adaptation.","fort"],["No weapon explains conquest alone","Alliances, epidemic disease, finance, political division and coercion shape outcomes alongside gunpowder."],[Oe("constantinople","Constantinople","1453","Bosporus","Mehmed II \xB7 Ottomans","Byzantine defenders & allies",["cannon","crossbow"],"siege",[["An imperial capital, isolated","Ottoman forces surround Constantinople. Its land walls remain formidable, but defenders and outside support are limited."],["Bombardment and repeated pressure","Cannon damage the walls while defenders repair them. Land assaults and naval pressure stretch the defense."],["The defenses are overwhelmed","The city falls on 29 May. The Byzantine Empire ends; conquest brings killing, enslavement and a new Ottoman capital."]],Qt+"article/1180/1453-the-fall-of-constantinople/","Cannon were important, but so were numbers, blockade, repairs and the final assaults."),Oe("tenochtitlan","Tenochtitlan","1521","Lake Texcoco, Mexico","Spanish & Indigenous allies","Mexica defenders",["musket","spear"],"lake-city",[["A city in a lake","Mexica defenders use causeways and canoes. Cort\xE9s returns with a large coalition of Indigenous enemies of the Mexica."],["Cut the city\u2019s lifelines","Coalition attacks along causeways combine with brigantines on the lake. Siege and disease exhaust the defenders."],["A capital is destroyed","Tenochtitlan falls after prolonged resistance. Spanish colonial rule grows through Indigenous alliances, coercion and catastrophic population loss."]],Qt+"article/2028/the-fall-of-tenochtitlan/","Indigenous allies were indispensable. This was not a tiny European force defeating an empire with guns alone."),Oe("panipat","First Panipat","1526","Northern India","Babur\u2019s army","Ibrahim Lodi\u2019s army",["cannon","elephant"],"volley",[["A smaller army prepares a front","Babur uses linked carts and protected gun positions against Ibrahim Lodi\u2019s larger force, which includes war elephants."],["Fix the front, threaten the sides","Firearms and fieldworks disrupt the advance. Mounted troops apply pressure around the flanks."],["A new dynasty takes root","Ibrahim is killed and his army defeated. Babur captures Delhi and Agra, beginning Mughal rule while major rivals remain."]],"https://panipat.gov.in/first-battle/","Numbers are uncertain. Guns, fieldworks, maneuver and command worked together."),Oe("nagashino","Nagashino","1575","Mikawa, Japan","Oda\u2013Tokugawa alliance","Takeda army",["musket","cavalry"],"palisade",[["Defend the shooters","The allied army positions firearms behind wooden barriers near Nagashino, with infantry supporting the defense."],["Attacks meet prepared fire","Takeda assaults fail against combined obstacles, firearm fire and other troops. The attacking force suffers heavily."],["A defeat, then a slower collapse","The Takeda lose key commanders and strength. Their domain survives until 1582; the famous rotating-volley story is disputed."]],Mi+"Battle_of_Nagashino","Reliable evidence does not establish the popular account of exactly 3,000 guns firing in three rotating ranks.")]),Wt("oceans","The sea becomes a battlefield","1500\u20131700","Ships fight for routes, supply and room to move.",[["galley","War galley","Oars, forward guns, boarding","Crew endurance; limited range"],["galleon","Ocean-going gunship","Sails + broadside cannon","Wind and skilled seamanship"],["junk","Korean panokseon","Stable platform for cannon","Needs favorable positioning"]],["The ship is a firing platform.","Cannon extend reach, but fleets still need formation, weather judgment, trained crews and boarding forces.","naval","Geography multiplies force.","Straits and anchorages compress fleets. Tides and wind may help one force and frustrate another.","choke"],["An ocean empire runs on ports","Dockyards, timber, rope, food and credit keep fleets at sea. Scurvy, disease and shipwreck kill beyond the battle line."],[Oe("lepanto","Lepanto","1571","Gulf of Patras","Holy League fleet","Ottoman fleet",["galley","galley"],"naval-line",[["Two great galley fleets","The Holy League and Ottoman fleets deploy in broad divisions. Galleasses add heavy gunfire ahead of parts of the allied line."],["Gunfire becomes a boarding battle","After the approach, ships close and soldiers fight across decks. Reserves and wing movements affect the center\u2019s struggle."],["A great victory with limits","The Holy League wins decisively. The Ottomans rebuild their fleet and retain Cyprus; sea power is not settled in one day."]],Mi+"Battle_of_Lepanto","Galley warfare did not abruptly disappear after this battle."),Oe("armada","The Armada campaign","1588","English Channel & Atlantic","English fleet","Spanish Armada",["galleon","galleon"],"fireships",[["Protect the invasion rendezvous","Spain\u2019s fleet must meet the Duke of Parma\u2019s army. English attacks harass its formation as it sails up the Channel."],["An anchorage breaks apart","English fireships scatter the Armada off Calais. Fighting near Gravelines and wind prevent a successful rendezvous."],["The return voyage is devastating","The invasion fails. Storms and shipwrecks compound losses on the route around Britain and Ireland; the war continues."]],"https://www.rmg.co.uk/collections/objects/rmgc-object-11755","This is a campaign, not one battle. Neither English guns nor storms alone explain the outcome."),Oe("myeongnyang","Myeongnyang","1597","Southwestern Korea","Yi Sun-sin \xB7 Joseon","Japanese fleet",["junk","junk"],"strait",[["A small fleet holds a passage","After an earlier naval disaster, Yi has only a small force available. A much larger Japanese fleet approaches."],["The strait limits numbers","Confined water, currents and Korean gunnery help Yi resist. Japanese ships cannot bring their full numerical advantage to bear."],["A fleet survives to fight again","The Japanese withdraw from the encounter. Yi preserves a naval force that continues to threaten invasion supply routes."]],"https://kh.or.kr/cms/content/view/1250","Exact Japanese numbers and the sequence of tidal effects are debated. No turtle ship is shown here.")]),Wt("pike-shot","Pike, shot & the drilled army","1600\u20131750","Coordination turns weapons into a system.",[["pike","Pike","A barrier against cavalry","Little ranged power"],["musket","Musket","Massed gunfire","Slow loading under pressure"],["cannon","Field artillery","Disrupt and support","Needs teams, ammunition, roads"]],["Protect the reload.","Pikemen and musketeers cooperate. Cavalry and artillery work around them; a formation must fight and keep moving.","volley","The bayonet changes the mixture.","Over time, a musket with a bayonet lets one infantryman shoot and resist cavalry. Drill becomes increasingly important.","line"],["States learn to keep armies","Taxation, credit, magazines and permanent administration support larger forces. Civilian communities often pay through requisition and devastation."],[Oe("breitenfeld","Breitenfeld","1631","Saxony","Swedish\u2013Saxon alliance","Imperial\u2013League army",["musket","pike"],"pivot",[["A mixed coalition faces Tilly","Swedish and Saxon forces form adjacent lines. Imperial attacks put pressure on both wings."],["The ally breaks; the line turns","Saxon troops flee. Swedish units redeploy to meet the exposed flank while cavalry and guns create new pressure."],["Flexibility reverses the crisis","Gustavus Adolphus wins a major victory. It revitalizes the Protestant war effort; the Thirty Years\u2019 War lasts until 1648."]],Mi+"Battle_of_Breitenfeld_(1631)","The contrast is not modern tactics versus a frozen medieval block; both armies used pike, shot and cavalry."),Oe("rocroi","Rocroi","1643","Northeastern France","Enghien \xB7 French army","Melo \xB7 Spanish army",["cavalry","pike"],"flank",[["Each side has a vulnerable wing","French and Spanish forces meet near besieged Rocroi. Cavalry fights on the wings, infantry in the center."],["A winning wing returns inward","French cavalry success enables attacks against the enemy rear. Isolated Spanish infantry continues resisting."],["A major defeat, not instant obsolescence","France wins and relieves Rocroi. Spanish military power and pike-and-shot formations continue after the celebrated battle."]],Mi+"Battle_of_Rocroi","The familiar claim that Rocroi instantly ended Spanish military power is an exaggeration."),Oe("naseby","Naseby","1645","England","Parliament \xB7 New Model Army","Charles I \xB7 Royalists",["cavalry","musket"],"reserve",[["Two cavalry wings, two choices","Parliament\u2019s New Model Army faces the main Royalist army. Both sides seek to win on the flanks."],["Control matters after the charge","Cromwell\u2019s cavalry returns to attack the Royalist infantry. Much of Rupert\u2019s victorious wing continues its pursuit."],["The Royalist field army is broken","Parliament captures troops, equipment and the king\u2019s papers. Organized resistance continues, but the First Civil War\u2019s balance changes decisively."]],Cl+"battle-naseby","The diagram highlights cavalry control; infantry fighting and Parliamentary reserves also mattered.")]),Wt("revolution","Armies of the nation","1750\u20131815","Mass armies move as coordinated parts.",[["musket","Flintlock & bayonet","Volley fire + close defense","Smoke and limited accuracy"],["cannon","Mobile artillery","Concentrated battlefield fire","Ammunition and draft animals"],["galleon","Ship of the line","Heavy broadside batteries","Wind, crews and repair"]],["Line, column, square.","Line presents muskets. Column moves and concentrates. Square resists cavalry but offers a dense target to artillery.","square","March apart; fight together.","Corps combine infantry, cavalry and guns. They use separate roads, then concentrate at the decisive time.","converge"],["Mass mobilization has a price","Conscription expands armies. Food, weather, disease and stretched communications still limit them\u2014as the 1812 invasion of Russia demonstrates."],[Oe("austerlitz","Austerlitz","1805","Moravia","Napoleon \xB7 French army","Russian\u2013Austrian alliance",["musket","musket"],"heights",[["Invite pressure on the right","Napoleon presents a vulnerable right flank. Allied troops move away from the Pratzen Heights to attack it."],["Strike the weakened center","French troops ascend the heights while reinforcements sustain the threatened right. The allied army is divided."],["A coalition is broken","France wins; Austria leaves the coalition. Russia continues the struggle, and Napoleon\u2019s wider wars persist."]],Qt+"article/2253/battle-of-austerlitz/","The dramatic story of thousands drowning under shattered lake ice is greatly exaggerated."),Oe("trafalgar","Trafalgar","1805","Off southwestern Spain","Nelson \xB7 British fleet","French\u2013Spanish fleet",["galleon","galleon"],"break-line",[["Approach under fire","Nelson advances in two columns toward the allied line. British lead ships endure gunfire before their broadsides can reply."],["Break the line into local fights","The columns cut through the center and rear. British crews concentrate fire while parts of the allied fleet struggle to intervene."],["Command of the sea, at a cost","Britain wins a decisive naval victory; Nelson is killed. Napoleon\u2019s invasion plans had already shifted before the battle."]],"https://www.rmg.co.uk/collections/objects/rmgc-object-12040","Victory strengthens British naval dominance; it does not end the land war."),Oe("waterloo","Waterloo","1815","Present-day Belgium","Wellington & Bl\xFCcher \xB7 coalition","Napoleon \xB7 French army",["musket","cavalry"],"reinforce",[["Hold until the allies arrive","Wellington\u2019s multinational army holds a ridge and strongpoints. Prussian forces march to support it."],["A defense outlasts repeated attacks","Infantry, squares and defended farms absorb French assaults. Prussian troops pressure Napoleon\u2019s right."],["The final attack fails","The Imperial Guard is repulsed; coalition forces advance. Napoleon\u2019s army breaks, ending the Hundred Days campaign."]],Cl+"battle-waterloo","This was a coalition victory involving British, Dutch, Belgian, German and Prussian troops, among others.")]),Wt("industry","Rifles, railways & empire","1815\u20131913","Industry enlarges both reach and destruction.",[["rifle","Rifled firearms","Increasing range and rate of fire","Smoke, visibility and training"],["train","Railway & telegraph","Move mass; coordinate distance","Fixed routes can constrain"],["battleship","Steel warship","Steam, armor and heavy guns","Coal, maintenance, dockyards"]],["The exposed formation pays.","Improved firearms increase the danger of open advances. Cover, skirmish order, artillery and entrenchment gain importance.","fire","Industrial superiority is not a guarantee.","Command failures, local knowledge, numbers and maneuver can defeat a technically better-equipped force.","encircle"],["War reaches across empires","Colonial armies depend on local soldiers and labor. Expansion brings resistance, dispossession and violence far beyond famous engagements."],[Oe("gettysburg","Gettysburg","1863","Pennsylvania, United States","Meade \xB7 Union","Lee \xB7 Confederacy",["rifle","rifle"],"ridge",[["A meeting battle becomes a defense","After first-day fighting, Union forces occupy a connected line of high ground. Confederate attacks test its ends."],["The center becomes the target","On the third day, Confederate infantry crosses open ground after a bombardment. Union artillery and infantry break the assault."],["The invasion turns back","Lee retreats to Virginia. Gettysburg, alongside Vicksburg, changes the war\u2019s momentum; the conflict continues for almost two years."]],"https://www.nps.gov/gett/learn/historyculture/gettysburg-overview.htm","The map emphasizes the final assault, not all three days or the entire battlefield."),Oe("isandlwana","Isandlwana","1879","Zulu kingdom","Zulu army","British & colonial force",["spear","rifle"],"encircle",[["An invasion force is divided","Part of the British column leaves camp. A large Zulu force confronts the troops remaining near Isandlwana."],["The horns close around the line","Zulu forces engage the front and extend around the flanks. The spread-out defense loses cohesion and is overwhelmed."],["A Zulu victory in a lost war","The camp is destroyed. Britain later sends reinforcements and defeats the kingdom; battlefield success does not prevent conquest."]],Cl+"zulu-war","A simple story about sealed ammunition boxes does not adequately explain the defeat."),Oe("tsushima","Tsushima","1905","Korea Strait","T\u014Dg\u014D \xB7 Japanese fleet","Russian Baltic Fleet",["battleship","battleship"],"cross-t",[["A fleet at the end of a voyage","Russian ships reach East Asian waters after a long journey. Japanese scouting detects their approach."],["Position, speed and concentrated fire","T\u014Dg\u014D maneuvers across the Russian advance, then maintains pressure. Accurate fire and disrupted command compound Russian losses."],["A fleet is destroyed","Japan wins decisively, strengthening its position in the peace negotiations. Russian imperial prestige suffers a severe blow."]],"https://navyhistory.au/the-battle-of-tsushima-1905/","Crossing the T is one part of a prolonged battle, not a single magical maneuver.")]),Wt("ww1","The industrial battlefield","1914\u20131918","Firepower outruns communication.",[["machinegun","Machine gun","Sustained defensive fire","Ammunition, cooling, protection"],["howitzer","Heavy artillery","Indirect fire over great distances","Observation and shell supply"],["earlyTank","Early tank","Cross wire and support infantry","Slow and mechanically fragile"]],["Why trenches endure","Artillery and machine guns make open ground deadly. Trenches protect; communications fail when attackers move beyond prepared lines.","trench","Combine the effects.","By 1918, infantry, artillery, tanks and aircraft increasingly coordinate. Surprise and manageable objectives help turn a breach into progress.","combined"],["A world war behind the front","Factories, farms, colonial labor, merchant ships and railways sustain the fighting. Blockade, disease and civilian deprivation shape the outcome."],[Oe("marne","First Marne","1914","Northeastern France","French & British armies","German armies",["rifle","rifle"],"gap",[["The advance stretches apart","German armies approach Paris with tired troops and growing coordination problems. The French prepare a counteroffensive."],["A gap becomes a danger","French attacks pressure the flank while the BEF and French Fifth Army move between the German First and Second Armies."],["The quick victory is lost","German forces withdraw to the Aisne. Further attempts to turn the flanks help create a continuous entrenched front."]],Qt+"article/2891/first-battle-of-the-marne/","Paris taxis are memorable, but railways and the wider armies mattered far more to the battle."),Oe("somme","The Somme","1916","Northern France","British & French armies","German army",["rifle","machinegun"],"trench",[["Bombard, then advance","The Allies plan to break German defenses and relieve pressure on Verdun. Artillery prepares the assault."],["Some defenses survive","On much of the British front, wire and deep shelters survive. Returning defenders meet exposed infantry with devastating fire."],["Attrition replaces the breakthrough","The offensive continues for months, with uneven gains and enormous losses on both sides. No decisive breakthrough results."]],"https://www.iwm.org.uk/sites/default/files/press-release/Lives_of_FWW_Somme_Anniversary.pdf","The disastrous British first day was not the experience everywhere: French and southern British attacks gained more ground."),Oe("amiens","Amiens","1918","Northern France","Allied armies","German army",["earlyTank","machinegun"],"breakthrough",[["Prepare without a long warning","The Allies conceal preparations. Guns, infantry, tanks and aircraft are organized for a coordinated attack."],["Surprise plus combined arms","Under morning mist, British Empire and French forces advance. Tanks help infantry while artillery suppresses the defense."],["A breakthrough becomes a sequence","Large gains and prisoners shake German confidence. Continuing Allied offensives, blockade and exhaustion lead toward the armistice."]],"https://collection.nam.ac.uk/detail.php?acc=1995-03-84-24","Tanks broke down and attacks lost momentum. Amiens began the Hundred Days; it did not win the war alone.")]),Wt("ww2-land","War in depth","1939\u20131945 \xB7 land","A breakthrough matters only if it can be sustained.",[["tank","Tank","Protected mobile firepower","Fuel, maintenance, vulnerable support"],["truck","Motor transport & radio","Supply and faster coordination","Roads, traffic, exposed logistics"],["howitzer","Artillery & antitank guns","Suppress, stop and support","Needs reconnaissance and supply"]],["Concentrate at one point.","Coordinated forces can break a front, move into its rear and disrupt command. Tanks require infantry, engineers and artillery.","breakthrough","The flanks become the target.","A force concentrated on one objective may depend on weaker troops and long supply routes elsewhere.","encircle"],["An industrial war of endurance","Fuel, rail repair, replacements and production constrain every advance. Nazi conquest also includes occupation, mass murder and genocide."],[Oe("france-1940","France","1940","Western Europe","German armored forces","French & Allied armies",["tank","tank"],"breakthrough",[["The main effort arrives elsewhere","Allied forces move into Belgium. German armored formations pass through the Ardennes and cross the Meuse."],["From river crossing to the coast","German units exploit the breach and move west, disrupting communications and separating Allied armies in the north."],["A campaign collapses","Many troops escape through Dunkirk, but France is defeated. Coordination and operational decisions matter more than a simple tank-count comparison."]],"https://www.iwm.org.uk/sites/default/files/files/2024-12/SCRAMBLE_exhibition_guide_final.pdf","Blitzkrieg is a useful shorthand, not an explanation by itself. Much of the German army still used horses."),Oe("stalingrad","Stalingrad","1942\u20131943","Soviet Union","Soviet forces","German & Axis forces",["tank","rifle"],"encircle",[["The city absorbs the army","German troops fight through Stalingrad. Soviet defenders hold pockets near the Volga while reserves assemble beyond the city."],["Strike the weaker flanks","Operation Uranus attacks Axis forces north and south. Soviet spearheads meet behind the German Sixth Army."],["The pocket cannot be sustained","Airlift and relief fail. The trapped force surrenders in early 1943, a major turning point after immense military and civilian suffering."]],"https://www.nationalww2museum.org/war/articles/stalingrad-experimentation-adaptation-implementation","The diagram separates city fighting from the much larger encirclement. It is not a city-scale map."),Oe("alamein","Second El Alamein","1942","Egypt","British Eighth Army","German\u2013Italian Axis army",["tank","tank"],"minefield",[["A front that cannot be outflanked","Sea to the north and the Qattara Depression to the south restrict maneuver. Minefields and defenses span the gap."],["Open corridors under fire","Artillery supports infantry and engineers through the minefields. Attrition and renewed attacks wear down Axis reserves."],["The Axis retreats west","The Eighth Army wins. Supply problems and wider Allied operations turn retreat into the eventual Axis defeat in North Africa."]],Cl+"battle-alamein","The Eighth Army was multinational; the victory depended on material preparation and repeated attacks, not one tank charge.")]),Wt("ww2-sea-air","Beyond the horizon","1939\u20131945 \xB7 sea & air","Seeing, coordinating and supplying decide what can strike.",[["plane","Combat aircraft","Reconnaissance, air defense, attack","Range, weather, trained crews"],["carrier","Aircraft carrier","Move the airfield to sea","Scouting and protection"],["radar","Radar & command network","Detect and coordinate","Information must reach decisions"]],["A system sees farther.","Radar, observers, intelligence and command rooms turn scattered reports into useful warning. Detection alone does not win a battle.","network","The sea has a supply war.","Convoys, escorts, submarines and air patrols contest merchant routes. Keeping cargo moving can matter more than sinking a flagship.","convoy"],["Air superiority is a means","Air forces protect movement, challenge industry and support armies. Bombing also devastates cities; its effects and morality remain central historical questions."],[Oe("britain","Battle of Britain","1940","British airspace","RAF & air-defense network","Luftwaffe",["plane","plane"],"air-defense",[["An invasion needs air superiority","Germany seeks to weaken RAF Fighter Command. Britain combines radar, observers and centralized reporting."],["Warning becomes an interception","Controllers direct fighters toward raids. Pilots, ground crews, factories and repair keep the defense functioning under sustained pressure."],["Fighter Command survives","Germany fails to secure air superiority and postpones invasion. Bombing continues; Britain\u2019s survival also depends on the Royal Navy."]],"https://www.raf.mod.uk/what-we-do/our-history/anniversaries/battle-of-britain/","A changing air campaign, not one dogfight. Radar worked as part of a wider human and technical system."),Oe("midway","Midway","1942","Central Pacific","United States Navy","Imperial Japanese Navy",["carrier","carrier"],"carriers",[["Intelligence shapes the ambush","US codebreaking helps identify Midway as the target. American carriers prepare to meet the Japanese offensive."],["Scouting and timing collide","Many early American attacks fail. Dive-bombers then catch Japanese carriers in vulnerable moments and inflict decisive damage."],["Four carriers are lost","Japan loses four fleet carriers; the US loses Yorktown. The invasion is canceled, but a long Pacific war remains."]],"https://www.history.navy.mil/browse-by-topic/wars-conflicts-and-operations/world-war-ii/1942/midway.html","The popular \u201Cfive minutes from launching\u201D story oversimplifies Japanese deck operations. Success combined intelligence, decisions, skill and contingency."),Oe("normandy","Normandy landings","1944","Northern France","Allied invasion forces","German defenders",["landing","rifle"],"landing",[["Create a lodgment in Europe","Deception, air operations and naval preparation support landings on five beaches, with airborne troops securing key areas inland."],["Connect the scattered footholds","Landings encounter very different resistance. Allied forces build beachheads, link positions and move men and supplies ashore."],["The foothold becomes a front","The invasion succeeds, but the Normandy campaign takes weeks of costly fighting. Liberation is accompanied by major civilian losses."]],"https://www.iwm.org.uk/sites/default/files/files/2023-10/second_world_war_galleries_large_print.pdf","The schematic combines five beaches. The July breakout and the liberation of Paris did not happen on D-Day.")]),Wt("cold-war","The nuclear shadow","1945\u20131990","Total war becomes harder to contemplate; limited wars continue.",[["missile","Nuclear & guided missiles","Deterrence; more precise reach","Escalation and dependence on sensors"],["helicopter","Helicopter","Move troops beyond roads","Vulnerable and supply intensive"],["rifle","Infantry & portable weapons","Dispersed forces can endure","Local support and resupply matter"]],["Deterrence is a dangerous balance.","A surviving retaliatory force can discourage attack. Miscalculation, false warning and escalation make the balance uncertain.","deterrence","Military success meets political limits.","Decolonization and insurgency put legitimacy, civilian security, outside support and endurance at the center of war.","urban"],["Victory is a political condition","Destroying enemy formations does not necessarily establish stable rule. Civilian protection and a workable settlement affect what battlefield success can achieve."],[Oe("inchon","Inchon","1950","Korea","UN & South Korean forces","North Korean forces",["landing","rifle"],"landing",[["Land behind the advance","With UN forces holding the Pusan perimeter, MacArthur chooses a landing near Seoul, far behind the North Korean front."],["A risky landing meets a breakout","Amphibious forces land at Inchon while troops advance from Pusan. North Korean communications and retreat routes are threatened."],["A reversal, not an ending","Seoul is retaken and North Korean forces retreat. Chinese intervention later transforms the war; an armistice comes in 1953."]],"https://history.army.mil/portals/143/Images/Publications/catalog/19-2.pdf","Tides and narrow approaches made Inchon difficult. The wider campaign required the Pusan breakout as well."),Oe("dien-bien-phu","\u0110i\u1EC7n Bi\xEAn Ph\u1EE7","1954","Northwestern Vietnam","Viet Minh","French Union garrison",["howitzer","rifle"],"valley",[["An air-supplied base in a valley","French commanders expect a fortified position to draw the Viet Minh into a battle their firepower can win."],["The surrounding hills become decisive","Viet Minh logistics bring artillery into position. Bombardment and trenches constrict the garrison and compromise its air supply."],["The garrison falls","French Union forces surrender. The defeat strengthens the case for ending France\u2019s war; the Geneva settlement divides Vietnam provisionally."]],"https://indochine.uqam.ca/en/historical-dictionary/402-in-bien-ph-battle-of-13-march7-may-1954.html","The Viet Minh used a substantial conventional army and extraordinary logistical effort; this was not simply guerrillas defeating modern weapons."),Oe("october-war","The October War","1973","Sinai & Golan Heights","Egyptian & Syrian forces","Israeli forces",["missile","tank"],"crossing",[["Surprise on two fronts","Egypt crosses the Suez Canal while Syria attacks on the Golan Heights. Israel\u2019s initial assumptions prove costly."],["Weapons change the local balance","Antitank and air-defense systems help the attackers initially. Israeli mobilization and counterattacks later reverse much of the situation."],["A ceasefire opens diplomacy","Israel crosses west of the canal; Egypt retains a foothold east. Military results and political gains differ, leading toward later negotiations."]],"https://history.state.gov/milestones/1969-1976/arab-israeli-war-1973","The map emphasizes the Sinai front; the Golan campaign was separate. A single winner label would hide the political outcome.")]),Wt("networks","Sensors, cities & networks","1991\u20132022","More information does not remove uncertainty.",[["tank","Modern armor","Sensors + protected firepower","Still needs infantry and logistics"],["drone","Uncrewed aircraft","Persistent observation at many scales","Jamming, weather, attrition"],["satellite","Connected systems","Navigation, sensing, communication","Fragile links and contested signals"]],["Seeing must become understanding.","Sensors can shorten the time between observation and action. Deception, electronic interference and incomplete information remain.","network","The city resists simple diagrams.","Buildings, civilians, infrastructure and underground spaces complicate movement and firepower. Precision cannot remove the human cost.","urban"],["Old constraints remain","Fuel, ammunition, maintenance, morale and political goals still matter. These examples stop in 2022; they are not a live assessment of current wars."],[Oe("73-easting","73 Easting","1991","Southern Iraq","US armored cavalry","Iraqi Republican Guard",["tank","tank"],"fire",[["A desert encounter","US armored cavalry meets Iraqi defensive positions during the coalition\u2019s ground offensive to expel Iraqi forces from Kuwait."],["Detection and coordinated fire","Training, thermal sights and coordinated armored action give US forces major advantages during the encounter in poor visibility."],["A tactical victory inside a campaign","Iraqi units are defeated. Coalition operations liberate Kuwait, but the war does not resolve the region\u2019s wider political conflicts."]],"https://www.benning.army.mil/Armor/eARMOR/content/issues/1991/MAY_JUN/ArmorMayJune1991web.pdf","The battle is not evidence that technology alone wins wars. Preparation, leadership, support and context were essential."),Oe("mosul","Mosul","2016\u20132017","Iraq","Iraqi forces & coalition support","Islamic State (ISIL)",["rifle","rifle"],"urban",[["A city under occupation","Iraqi forces and partners seek to retake Mosul from ISIL. A large civilian population is trapped in the battle area."],["Urban resistance slows the advance","Dense buildings and prepared defenses constrain movement. Coalition support aids the offensive as combat causes devastating civilian harm."],["The city is retaken","Organized ISIL control of Mosul ends. Destruction, displacement and unexploded weapons persist; the wider insurgency does not disappear."]],"https://www.unhcr.org/news/stories/civilians-living-penury-and-panic-mosul-battle-rages-unhcr","The diagram is conceptual, not a street-level tactical reconstruction. No block represents a measured casualty count.",{sources:[{title:"UNHCR \u2014 civilians during the Mosul battle",url:"https://www.unhcr.org/news/stories/civilians-living-penury-and-panic-mosul-battle-rages-unhcr"},{title:"UN \u2014 protection of civilians and the retaking of Mosul",url:"https://documents.un.org/doc/undoc/gen/g18/185/94/pdf/g1818594.pdf"}]}),Oe("kyiv","Kyiv campaign","February\u2013April 2022","Ukraine","Ukrainian defenders","Russian invasion forces",["rifle","tank"],"supply",[["A plan for a rapid capital seizure","Russia attacks toward Kyiv on several axes. The plan assumes Ukrainian resistance and command will collapse quickly."],["The plan meets sustained resistance","Ukrainian forces keep fighting. Russian coordination, logistics and overstretched advances contribute to the failure to seize the capital."],["Withdrawal from the north","Russia withdraws from the Kyiv region. Ukraine preserves its government; the wider invasion and immense civilian suffering continue."]],"https://www.rusi.org/explore-our-research/publications/special-resources/preliminary-lessons-conventional-warfighting-russias-invasion-ukraine-february-july-2022","A retrospective of the opening campaign only. RUSI calls its findings preliminary; this is not an update on the current war.")])],Rf=[{id:"opening",kind:"opening",title:"The shape of war.",text:"Weapons change. The struggle to move, protect, supply and coordinate remains.",label:"A visual atlas of military history"},{id:"read-the-field",kind:"guide",title:"Read the battlefield.",text:"Figures symbolize formations. Colored arrows show movement; gold links show support. Terrain constrains choices. Colors identify sides, not moral judgments.",label:"A few marks. A whole story."},{id:"two-scales",kind:"scales",title:"A battle is not a war.",text:"Tactics solve the immediate fight. Strategy connects fighting, resources and politics to an objective. One can succeed while the other fails.",label:"The question behind every encounter"}],If=[{id:"patterns",kind:"patterns",title:"The recurring patterns.",text:"Concentrate. Coordinate. Protect a flank. Maintain supply. Adapt. No pattern guarantees victory.",label:"What travels across the centuries"},{id:"people",kind:"people",title:"Beyond the arrows.",text:"Every symbol conceals people. Military history also belongs to civilia
